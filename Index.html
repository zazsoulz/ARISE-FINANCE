<style>

  --bg:#0a0d11;--panel:rgba(18,23,30,.82);--panel2:rgba(23,29,37,.88);

#root{min-height:100vh}
.app{min-height:100vh;background:
 radial-gradient(circle at 10% 0%,rgba(155,191,174,.06),transparent 30%),
 radial-gradient(circle at 90% 12%,rgba(167,182,212,.05),transparent 28%)}
.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:18px 0 42px}

.modal{position:fixed;inset:0;background:rgba(3,5,7,.62);backdrop-filter:blur(16px);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;border:1px solid var(--line2);border-radius:26px 26px 0 0;background:#11161d;padding:22px;animation:sheet .3s var(--ease)}@keyframes sheet{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;max-width:360px;padding:13px 15px;border-radius:15px;border:1px solid var(--line2);background:rgba(17,22,29,.94);box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.3s var(--ease);font-size:13px}.toast.show{opacity:1;transform:none}
.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(560px,100%);padding:30px;border:1px solid var(--line);border-radius:28px;background:rgba(17,22,29,.86);box-shadow:var(--shadow);backdrop-filter:blur(25px)}
.check{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin-top:8px}.check input{width:auto}
@media(max-width:850px){.col-8,.col-6,.col-4{grid-column:span 12}.stat-grid{grid-template-columns:repeat(2,1fr)}.alloc-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.shell{width:min(100% - 18px,1180px)}.top{min-height:58px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.stat-grid,.alloc-grid{grid-template-columns:1fr 1fr}.card{padding:16px;border-radius:19px}.bar-row{grid-template-columns:105px 1fr 78px}.nav button{padding:9px 11px}}

<body>
<div id="root"></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast"></div>

<script>
"use strict";

/* =========================================================
   ARISE FINANCE — CLEAN LOCAL-FIRST CORE
   No external services are required for this build.
   The data layer is intentionally isolated so Supabase/auth
   can be attached later without rewriting the financial core.
   ========================================================= */

const STORAGE_KEY="arise.finance.v3";
const PERCENT_OPTIONS=[5,6,10,14,20,25,30,35,40,45,50,60,70,80,90,100];
const CURRENCY={RUB:{symbol:"₽",name:"Рубль"},EUR:{symbol:"€",name:"Евро"},USD:{symbol:"$",name:"Доллар"}};

let db=loadDB();
let activeProfileId=db.account.activeProfileId || db.profiles[0]?.id;
let activePage="home";

function id(){
  return crypto?.randomUUID?.() || "id_"+Date.now()+"_"+Math.random().toString(36).slice(2);
}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function clone(v){return JSON.parse(JSON.stringify(v))}
function today(){return new Date().toISOString().slice(0,10)}
function monthOf(date){return String(date||today()).slice(0,7)}
function money(v,currency=getProfile().settings.baseCurrency){
  const n=num(v);
  return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(Math.round(n))+" "+(CURRENCY[currency]?.symbol||currency);
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function saveDB(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}
function loadDB(){
  try{
    const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||"");
    if(raw?.account && Array.isArray(raw.profiles)) return raw;
  }catch(_){}
  const p=createProfile("Мой профиль");
  const initial={account:{name:"Пользователь",avatar:"",activeProfileId:p.id},profiles:[p]};
  localStorage.setItem(STORAGE_KEY,JSON.stringify(initial));
  return initial;
}
function createProfile(name){
  return {
    id:id(),name,
    settings:{
      baseCurrency:"RUB",
      reserve:{percent:0,cap:null},
      uncontrolledIncomePolicy:"warn",
      monthlyBasicBaseline:0
    },
    categories:[
      {id:id(),name:"Обязательные расходы",fixed:true,fixedAmount:0,percent:0,priority:5,cap:null,enabled:true,color:"green"},
      {id:id(),name:"Семья",fixed:false,fixedAmount:0,percent:20,priority:4,cap:null,enabled:true,color:"blue"},
      {id:id(),name:"Свободные деньги",fixed:false,fixedAmount:0,percent:20,priority:3,cap:null,enabled:true,color:"purple"}
    ],
    goals:[],
    transactions:[],
    createdAt:new Date().toISOString()
  };
}
function getProfile(){
  return db.profiles.find(p=>p.id===activeProfileId) || db.profiles[0];
}
function setProfile(idv){
  if(!db.profiles.some(p=>p.id===idv))return;
  activeProfileId=idv;db.account.activeProfileId=idv;saveDB();render();
}

/* =========================================================
   FINANCIAL ENGINE
   Fixed categories first.
   Percentage categories are percentages of TOTAL income.
   Amounts are whole rubles; largest-remainder rounding keeps
   the final distribution exactly equal to income.
   ========================================================= */

function allocateInteger(total,items){
  const clean=items.map(x=>({...x,raw:total*x.percent/100}));
  const base=clean.map(x=>Math.floor(x.raw));
  let left=Math.round(total)-base.reduce((a,b)=>a+b,0);
  clean.map((x,i)=>({i,frac:x.raw-Math.floor(x.raw)}))
    .sort((a,b)=>b.frac-a.frac)
    .forEach(x=>{if(left>0){base[x.i]++;left--}});
  return clean.map((x,i)=>({...x,amount:base[i]}));
}

function calculatePlan(income,profile,date=today()){
  income=Math.round(num(income));
  const cats=profile.categories.filter(c=>c.enabled);
  const fixed=cats.filter(c=>c.fixed);
  const flexible=cats.filter(c=>!c.fixed && c.name!=="Свободные деньги");
  const free=cats.find(c=>c.name==="Свободные деньги" && c.enabled);

  let fixedTotal=0;
  const result={income,basic:0,family:0,creative:0,free:0,reserve:0,goals:[],categories:[],distributed:0,remaining:income,date};

  fixed.forEach(c=>{
    const amount=Math.max(0,Math.round(num(c.fixedAmount)));
    fixedTotal+=amount;
    result.categories.push({categoryId:c.id,name:c.name,amount,fixed:true});
  });

  if(fixedTotal>income){
    return {...result,error:"Фиксированные расходы превышают доход. Настрой реальные суммы перед расчётом."};
  }

  const pct=flexible
    .filter(c=>num(c.percent)>0)
    .sort((a,b)=>num(b.priority)-num(a.priority)||num(b.percent)-num(a.percent));

  const allocations=allocateInteger(income,pct);
  allocations.forEach((a,i)=>{
    const c=pct[i];
    const cap=c.cap==null?null:Math.max(0,Math.round(num(c.cap)));
    const amount=cap==null?a.amount:Math.min(a.amount,cap);
    result.categories.push({categoryId:c.id,name:c.name,amount,fixed:false,percent:c.percent});
  });

  let used=result.categories.reduce((s,x)=>s+x.amount,0);

  /* Free money is the final visible remainder.
     It is never allowed to become negative. */
  let reserve=Math.round(income*(num(profile.settings.reserve.percent)/100));
  const reserveCap=profile.settings.reserve.cap==null?null:Math.round(num(profile.settings.reserve.cap));
  if(reserveCap!=null)reserve=Math.min(reserve,reserveCap);

  const currentFree=result.categories.find(x=>x.name==="Свободные деньги");
  if(currentFree){
    currentFree.amount=Math.max(0,currentFree.amount-reserve);
  }else{
    result.categories.push({categoryId:null,name:"Свободные деньги",amount:0,fixed:false,percent:0});
  }

  used=result.categories.reduce((s,x)=>s+x.amount,0)+reserve;
  let freeAmount=Math.max(0,income-used);
  result.categories.find(x=>x.name==="Свободные деньги").amount+=freeAmount;
  result.reserve=reserve;
  result.distributed=result.categories.reduce((s,x)=>s+x.amount,0)+reserve;
  result.remaining=income-result.distributed;

  result.basic=result.categories.find(x=>x.name==="Обязательные расходы")?.amount||0;
  result.family=result.categories.find(x=>x.name==="Семья")?.amount||0;
  result.creative=result.categories.find(x=>x.name==="Творчество")?.amount||0;
  result.free=result.categories.find(x=>x.name==="Свободные деньги")?.amount||0;

  /* Goals receive only from explicitly configured goal funding.
     Existing goals are not silently filled by the engine. */
  result.goals=profile.goals.filter(g=>g.status!=="completed").map(g=>({
    id:g.id,name:g.name,amount:0,needBefore:Math.max(0,num(g.target)-num(g.current))
  }));

  return result;
}

function applyIncome(profile,form,plan){
  const t={
    id:id(),type:"income",date:form.date||today(),month:monthOf(form.date),
    source:form.source||"",currency:form.currency||profile.settings.baseCurrency,
    income:Math.round(num(form.income)),allocations:clone(plan.categories),
    reserve:Math.round(num(plan.reserve)),goals:[],distributed:Math.round(plan.distributed)
  };
  t.remaining=Math.round(t.income-t.distributed);
  profile.transactions.push(t);
  saveDB();
  return t;
}

function addExpense(profile,form){
  const amount=Math.round(num(form.amount));
  if(amount<=0) return {ok:false,message:"Сумма расхода должна быть больше 0 ₽."};
  const free=monthStats(profile,monthOf(form.date)).free;
  const category=form.categoryId ? profile.categories.find(c=>c.id===form.categoryId):null;
  const label=category?.name||"Свободные деньги";
  const uncontrolled=amount>free && !form.categoryId;
  const t={id:id(),type:"expense",date:form.date||today(),month:monthOf(form.date),
    source:form.source||"",categoryId:form.categoryId||null,categoryName:label,
    currency:form.currency||profile.settings.baseCurrency,amount,uncontrolled};
  profile.transactions.push(t);saveDB();
  return {ok:true,transaction:t,uncontrolled};
}

/* =========================================================
   STATISTICS
   ========================================================= */

function monthStats(profile,month){
  const tx=profile.transactions.filter(t=>t.month===month);
  const s={income:0,expenses:0,basic:0,family:0,creative:0,free:0,reserve:0,goals:0,operations:tx.length};
  tx.forEach(t=>{
    if(t.type==="income"){
      s.income+=num(t.income);s.reserve+=num(t.reserve);
      (t.allocations||[]).forEach(a=>{
        if(a.name==="Обязательные расходы")s.basic+=num(a.amount);
        else if(a.name==="Семья")s.family+=num(a.amount);
        else if(a.name==="Творчество")s.creative+=num(a.amount);
        else if(a.name==="Свободные деньги")s.free+=num(a.amount);
      });
      (t.goals||[]).forEach(g=>s.goals+=num(g.amount));
    }else if(t.type==="expense"){
      s.expenses+=num(t.amount);
      if(t.categoryName==="Свободные деньги")s.free-=num(t.amount);
    }
  });
  return s;
}
function allMonths(profile){
  const set=new Set(profile.transactions.map(t=>t.month).filter(Boolean));
  set.add(monthOf(today()));
  return [...set].sort();
}
function totalReserve(profile){
  return profile.transactions.reduce((s,t)=>s+(t.type==="income"?num(t.reserve):0),0);
}
function totalIncome(profile){
  return profile.transactions.reduce((s,t)=>s+(t.type==="income"?num(t.income):0),0);
}
function averageMonthlyGoalFunding(profile,goal){
  const values=profile.transactions.map(t=>(t.goals||[]).find(g=>g.id===goal.id)?.amount||0).filter(v=>v>0);
  return values.length?values.reduce((a,b)=>a+b,0)/values.length:0;
}
function goalForecast(profile,g){
  const left=Math.max(0,num(g.target)-num(g.current));
  if(g.status==="completed"||left<=0)return "Цель достигнута";
  const avg=averageMonthlyGoalFunding(profile,g);
  if(!avg)return "Недостаточно данных для прогноза";
  const months=Math.ceil(left/avg);
  const date=new Date();date.setMonth(date.getMonth()+months);
  const text=date.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  if(g.deadline){
    return date<=new Date(g.deadline) ? `Прогноз: ${text}` : `Не успевает к дедлайну · ${text}`;
  }
  return `Прогноз: ${text}`;
}

/* =========================================================
   UI HELPERS
   ========================================================= */

function toast(text){
  const el=document.getElementById("toast");el.textContent=text;el.classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),2600);
}
function openModal(html){
  document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

function header(){
  const p=getProfile();
  const letter=(p.name||"М").slice(0,1).toUpperCase();
  return `<div class="top">
    <div class="brand">ARISE <span>FINANCE</span></div>
    <div class="account">
      <div class="avatar">${db.account.avatar?`<img src="${esc(db.account.avatar)}">`:esc((db.account.name||"П").slice(0,1).toUpperCase())}</div>
      <span>${esc(db.account.name||"Пользователь")}</span>
    </div>
  </div>`;
}
function nav(){
  const items=[["home","Главная"],["income","Доход"],["expenses","Расходы"],["goals","Цели"],["history","История"],["statistics","Статистика"],["settings","Настройки"]];
  return `<div class="nav">${items.map(x=>`<button class="${activePage===x[0]?"active":""}" data-page="${x[0]}">${x[1]}</button>`).join("")}</div>`;
}
function render(){
  const root=document.getElementById("root");
  root.innerHTML=`<div class="app"><div class="shell">${header()}${nav()}<main id="page"></main></div></div>`;
  document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{activePage=b.dataset.page;render()});
  ({
    home:renderHome,income:renderIncome,expenses:renderExpenses,goals:renderGoals,
    history:renderHistory,statistics:renderStatistics,settings:renderSettings
  }[activePage]||renderHome)();
}

/* =========================================================
   HOME
   ========================================================= */

function renderHome(){
  const p=getProfile(),m=monthOf(today()),s=monthStats(p,m);
  const activeGoals=p.goals.filter(g=>g.status!=="completed");
  const reserve=totalReserve(p);
  const months=allMonths(p).slice(-6);
  const max=Math.max(1,...months.map(x=>monthStats(p,x).income));

  document.getElementById("page").innerHTML=`<div class="grid">
    <div class="col-12"><div class="card">
      <div class="kicker">ФИНАНСОВАЯ СИСТЕМА</div>
      <h1>Твои деньги под контролем.</h1>
      <div class="sub">ARISE показывает всю картину: сколько пришло, куда распределено, сколько можно потратить свободно и что происходит с целями.</div>
      <div class="actions"><button class="btn primary" id="addIncome">Добавить доход</button><button class="btn" id="addExpense">Добавить расход</button><button class="btn" id="addGoal">Добавить цель</button></div>
    </div></div>

function showIncomeModal(){
  const p=getProfile();
  openModal(`<div class="kicker">НОВЫЙ ДОХОД</div><h2 style="margin-top:7px">Распределение</h2>
    <div class="form" style="margin-top:15px">
      <div class="field full"><label>Сумма</label><input id="incAmount" type="number" min="1" placeholder="150000"></div>
      <div class="field"><label>Источник · по желанию</label><input id="incSource" placeholder="Зарплата"></div>
      <div class="field"><label>Дата</label><input id="incDate" type="date" value="${today()}"></div>
      <div class="field full"><label>Валюта</label><select id="incCurrency">${Object.entries(CURRENCY).map(([k,v])=>`<option value="${k}" ${k===p.settings.baseCurrency?"selected":""}>${v.name} (${v.symbol})</option>`).join("")}</select></div>
    </div>
    <div id="incResult" style="margin-top:14px"></div>
    <div class="actions"><button class="btn primary" id="calcIncome">Рассчитать</button><button class="btn" id="closeInc">Закрыть</button></div>`);
  document.getElementById("closeInc").onclick=closeModal;
  document.getElementById("calcIncome").onclick=()=>{
    const amount=Math.round(num(document.getElementById("incAmount").value));
    const date=document.getElementById("incDate").value||today();
    const source=document.getElementById("incSource").value.trim();
    if(amount<=0){toast("Введите доход больше нуля.");return}
    const plan=calculatePlan(amount,p,date);
    if(plan.error){document.getElementById("incResult").innerHTML=`<div class="notice">${esc(plan.error)}</div>`;return}
    let html=`<div class="notice">ARISE предлагает план для <strong>${money(amount,document.getElementById("incCurrency").value)}</strong>. Ты можешь изменить любую сумму, но итог обязан сойтись с доходом.</div>
      <div class="alloc-grid">`;
    plan.categories.forEach((a,i)=>html+=`<div class="alloc"><div class="kicker">${esc(a.name)}</div><input class="editAlloc" data-name="${esc(a.name)}" type="number" value="${a.amount}" style="margin-top:8px"></div>`);
    html+=`<div class="alloc"><div class="kicker">РЕЗЕРВ</div><input id="editReserve" type="number" value="${plan.reserve}" style="margin-top:8px"></div></div>
      <div id="incSummary" class="notice" style="margin-top:12px"></div>
      <div class="actions"><button class="btn primary" id="applyIncome">Применить план</button></div>`;
    document.getElementById("incResult").innerHTML=html;
    const update=()=>{
      let distributed=0;
      document.querySelectorAll(".editAlloc").forEach(x=>distributed+=Math.max(0,Math.round(num(x.value))));
      distributed+=Math.max(0,Math.round(num(document.getElementById("editReserve").value)));
      const left=amount-distributed;
      document.getElementById("incSummary").innerHTML=left===0?`Распределено: <strong>${money(distributed)}</strong> · Остаток: <strong class="positive">0 ₽</strong>`:left>0?`Распределено: <strong>${money(distributed)}</strong> · Осталось распределить: <strong class="warning">${money(left)}</strong>`:`Распределено больше дохода на <strong class="negative">${money(Math.abs(left))}</strong>`;
    };
    document.querySelectorAll(".editAlloc,#editReserve").forEach(x=>x.oninput=update);update();
    document.getElementById("applyIncome").onclick=()=>{
      let distributed=0;const allocations=[];
      document.querySelectorAll(".editAlloc").forEach(x=>{const amount=Math.max(0,Math.round(num(x.value)));distributed+=amount;allocations.push({name:x.dataset.name,amount})});
      const reserve=Math.max(0,Math.round(num(document.getElementById("editReserve").value)));distributed+=reserve;
      if(distributed!==amount){toast("План нельзя сохранить: распределение должно точно равняться доходу.");return}
      const tx=applyIncome(p,{income:amount,source,date,currency:document.getElementById("incCurrency").value},{...plan,categories:allocations,reserve,distributed});
      closeModal();toast("Доход сохранён.");activePage="history";render();
    };
  };
}

function showGoalModal(goalIdv){
  const p=getProfile(),g=goalIdv?p.goals.find(x=>x.id===goalIdv):null;
  openModal(`<div class="kicker">ЦЕЛЬ</div><h2 style="margin-top:7px">${g?"Редактировать":"Создать"} цель</h2>
    <div class="form" style="margin-top:15px">
      <div class="field full"><label>Название</label><input id="goalName" value="${esc(g?.name||"")}" placeholder="Отпуск"></div>
      <div class="field"><label>Целевая сумма</label><input id="goalTarget" type="number" value="${g?.target||""}" placeholder="125000"></div>
      <div class="field"><label>Приоритет</label><select id="goalPriority">${[5,4,3,2,1].map(v=>`<option value="${v}" ${(g?.priority||3)===v?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field"><label>Дедлайн · по желанию</label><input id="goalDeadline" type="date" value="${g?.deadline||""}"></div>
      <div class="field"><label>Текущая сумма</label><input id="goalCurrent" type="number" value="${g?.current||0}"></div>
    </div>
    <div class="actions"><button class="btn primary" id="saveGoal">${g?"Сохранить":"Создать"}</button><button class="btn" id="closeGoal">Закрыть</button></div>`);
  document.getElementById("closeGoal").onclick=closeModal;
  document.getElementById("saveGoal").onclick=()=>{
    const name=document.getElementById("goalName").value.trim(),target=Math.round(num(document.getElementById("goalTarget").value)),current=Math.round(num(document.getElementById("goalCurrent").value));
    if(!name||target<=0){toast("Укажи название и сумму цели.");return}
    const data={name,target,current:Math.min(current,target),priority:num(document.getElementById("goalPriority").value),deadline:document.getElementById("goalDeadline").value,status:current>=target?"completed":"active"};
    if(g)Object.assign(g,data);else p.goals.push({id:id(),...data,createdAt:today()});
    const saved=p.goals.find(x=>x.name===name&&x.target===target);
    if(saved&&saved.status==="completed")saved.completedAt=today();
    saveDB();closeModal();toast(g?"Цель обновлена.":"Цель создана.");render();
  };
}
function fundGoalModal(goalIdv){
  const p=getProfile(),g=p.goals.find(x=>x.id===goalIdv);if(!g)return;
  openModal(`<div class="kicker">ПОПОЛНЕНИЕ ЦЕЛИ</div><h2 style="margin-top:7px">${esc(g.name)}</h2><div class="sub">${money(g.current)} из ${money(g.target)}</div>
    <div class="field" style="margin-top:16px"><label>Сумма</label><input id="goalFund" type="number" min="1" placeholder="10000"></div>
    <div class="actions"><button class="btn primary" id="saveFund">Пополнить</button><button class="btn" id="closeFund">Закрыть</button></div>`);
  document.getElementById("closeFund").onclick=closeModal;
  document.getElementById("saveFund").onclick=()=>{
    const a=Math.round(num(document.getElementById("goalFund").value));if(a<=0){toast("Введите сумму больше нуля.");return}
    g.current=Math.min(g.target,g.current+a);
    if(g.current>=g.target){g.status="completed";g.completedAt=today();toast("Цель достигнута. Теперь реши, куда направлять её прежнее распределение.");}
    saveDB();closeModal();render();
  };
}

    <div class="col-6"><div class="card"><div class="kicker">АККАУНТ</div>
      <div class="field"><label>Имя владельца аккаунта</label><input id="accountName" value="${esc(db.account.name)}"></div>
      <div class="field" style="margin-top:10px"><label>URL фото профиля · по желанию</label><input id="accountAvatar" value="${esc(db.account.avatar||"")}" placeholder="https://..."></div>
      <div class="actions"><button class="btn" id="saveAccount">Сохранить аккаунт</button></div>
    </div></div>

    <div class="col-12"><div class="card"><div class="kicker">СИСТЕМА РАСПРЕДЕЛЕНИЯ</div><h2 style="margin-top:7px">Категории</h2>
      <div class="sub">Фиксированная категория получает заданную сумму первой. Остальные категории получают выбранный процент от общего дохода. Проценты не пересчитываются в дробные значения.</div>
      <div id="catList" style="margin-top:13px">${p.categories.map(c=>categoryEditor(c)).join("")}</div>
      <div class="actions"><button class="btn" id="addCategory">+ Категория</button><button class="btn primary" id="saveCategories">Сохранить настройки</button></div>
    </div></div>

    <div class="col-12"><div class="card"><div class="kicker">РЕЗЕРВ</div><h2 style="margin-top:7px">Финансовая подушка</h2>
      <div class="form"><div class="field"><label>Процент от общего дохода</label><select id="reservePercent">${PERCENT_OPTIONS.map(v=>`<option value="${v}" ${v===num(p.settings.reserve.percent)?"selected":""}>${v}%</option>`).join("")}<option value="0" ${num(p.settings.reserve.percent)===0?"selected":""}>0%</option></select></div><div class="field"><label>Лимит в месяц · необязательно</label><input id="reserveCap" type="number" value="${p.settings.reserve.cap??""}" placeholder="10000"></div></div>
      <div class="actions"><button class="btn primary" id="saveReserve">Сохранить резерв</button></div>
    </div></div>

    <div class="col-12"><div class="card"><div class="kicker">ПРОФИЛИ</div><h2 style="margin-top:7px">Отдельные финансовые сценарии</h2><div class="sub">Один аккаунт может содержать несколько полностью независимых финансовых профилей.</div>
      ${db.profiles.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><div class="tiny muted">${x.id===activeProfileId?"Текущий профиль":`${x.transactions.length} операций · ${x.goals.length} целей`}</div></div><div class="actions" style="margin:0">${x.id!==activeProfileId?`<button class="btn" data-switch="${x.id}">Открыть</button>`:""}${db.profiles.length>1?`<button class="btn danger" data-profile-del="${x.id}">Удалить</button>`:""}</div></div>`).join("")}
      <div class="actions"><button class="btn" id="newProfile">+ Новый профиль</button></div>
    </div></div>
  </div>`;
  document.getElementById("saveProfile").onclick=()=>{
    p.name=document.getElementById("profileName").value.trim()||"Мой профиль";p.settings.baseCurrency=document.getElementById("baseCurrency").value;saveDB();toast("Профиль сохранён.");render();
  };
  document.getElementById("saveAccount").onclick=()=>{
    db.account.name=document.getElementById("accountName").value.trim()||"Пользователь";db.account.avatar=document.getElementById("accountAvatar").value.trim();saveDB();toast("Аккаунт сохранён.");render();
  };
  document.getElementById("addCategory").onclick=()=>{p.categories.push({id:id(),name:"Новая категория",fixed:false,fixedAmount:0,percent:5,priority:3,cap:null,enabled:true,color:"green"});saveDB();render()};
  document.getElementById("saveCategories").onclick=()=>{
    const rows=[...document.querySelectorAll("[data-cat]")];rows.forEach(r=>{const c=p.categories.find(x=>x.id===r.dataset.cat);if(!c)return;c.name=r.querySelector(".cat-name").value.trim()||"Категория";c.fixed=r.querySelector(".cat-fixed").checked;c.fixedAmount=num(r.querySelector(".cat-fixed-amount").value);c.percent=num(r.querySelector(".cat-percent").value);c.priority=num(r.querySelector(".cat-priority").value);c.cap=r.querySelector(".cat-cap").value===""?null:num(r.querySelector(".cat-cap").value);c.enabled=r.querySelector(".cat-enabled").checked});saveDB();toast("Система распределения сохранена.");render()};
  document.getElementById("saveReserve").onclick=()=>{p.settings.reserve.percent=num(document.getElementById("reservePercent").value);p.settings.reserve.cap=document.getElementById("reserveCap").value===""?null:num(document.getElementById("reserveCap").value);saveDB();toast("Настройки резерва сохранены.");render()};
  document.getElementById("newProfile").onclick=()=>{
    const name=prompt("Название нового финансового профиля","Тестовый профиль");if(!name)return;
    const np=createProfile(name.trim());db.profiles.push(np);saveDB();setProfile(np.id);
  };
  document.querySelectorAll("[data-switch]").forEach(b=>b.onclick=()=>setProfile(b.dataset.switch));
  document.querySelectorAll("[data-profile-del]").forEach(b=>b.onclick=()=>{if(confirm("Удалить профиль и всю его историю?")){db.profiles=db.profiles.filter(x=>x.id!==b.dataset.profileDel);activeProfileId=db.profiles[0].id;db.account.activeProfileId=activeProfileId;saveDB();render()}});
}
function categoryEditor(c){
  return `<div class="card" data-cat="${c.id}" style="padding:14px;margin-bottom:9px;background:rgba(255,255,255,.015);box-shadow:none">
    <div class="form">
      <div class="field full"><label>Название</label><input class="cat-name" value="${esc(c.name)}"></div>
      <div class="field"><label>Процент</label><select class="cat-percent">${PERCENT_OPTIONS.map(v=>`<option value="${v}" ${num(c.percent)===v?"selected":""}>${v}%</option>`).join("")}</select></div>
      <div class="field"><label>Приоритет</label><select class="cat-priority">${[5,4,3,2,1].map(v=>`<option value="${v}" ${num(c.priority)===v?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field"><label>Лимит в месяц</label><input class="cat-cap" type="number" value="${c.cap??""}" placeholder="Без лимита"></div>
      <div class="field"><label>Фиксированная сумма</label><input class="cat-fixed-amount" type="number" value="${c.fixedAmount||0}"></div>
    </div>
    <label class="check"><input class="cat-fixed" type="checkbox" ${c.fixed?"checked":""}> Фиксированная категория</label>
    <label class="check"><input class="cat-enabled" type="checkbox" ${c.enabled?"checked":""}> Участвует в системе</label>
  </div>`;
}

/* =========================================================
   START
   ========================================================= */
render();
</script>
</body>
</html>
