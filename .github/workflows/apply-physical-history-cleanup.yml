name: Apply physical history cleanup

on:
  push:
    branches:
      - agent/physical-remove-legacy-history

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-remove-legacy-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded cleanup
        run: node scripts/remove-legacy-history-source.js --write app-shell.html index.html
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-physical-history-cleanup.yml
      - name: Commit cleanup result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.html index.html .github/workflows/apply-physical-history-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: physically remove retired History renderer"
          git push origin HEAD:agent/physical-remove-legacy-history
