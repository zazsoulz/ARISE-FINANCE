name: ARISE free money core fix

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          def replace_once(pattern, replacement, label):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')

          replace_once(
              r'function validatePlan\(plan\)\{.*?\n\}\n\n\n/\* =========================================================\n   TRANSACTIONS',
              '''function validatePlan(plan){
  const total = Math.max(
    0,
    integer(plan.total)
  );

  const distributed =
    plan.allocations.reduce(
      (sum,item)=>
        sum +
        Math.max(
          0,
          integer(item.amount)
        ),
      0
    ) +
    Math.max(
      0,
      integer(plan.reserve)
    );

  const remainder =
    total-distributed;

  return {
    distributed,
    remainder,
    difference:remainder,
    valid:
      total>0 &&
      remainder>=0
  };
}


/* =========================================================
   TRANSACTIONS''',
              'validatePlan'
          )

          text = re.sub(
              r'reserve:\s*\n\s*integer\(data\.reserve \|\| 0\),\s*\n\s*remainder:\s*\n\s*integer\(data\.remainder \|\| 0\),',
              'reserve:\n      integer(data.reserve || 0),\n\n    remainder:\n      integer(data.remainder || 0),',
              text,
              count=1
          )

          replace_once(
              r'function monthStats\(\s*profile,\s*month\s*\)\{.*?\n\}\n\nfunction allMonths',
              '''function monthStats(
  profile,
  month
){
  const transactions =
    monthTransactions(
      profile,
      month
    );

  const stats = {
    income:0,
    expenses:0,
    reserve:0,
    free:0,
    allocations:{},
    operations:transactions.length
  };

  transactions.forEach(tx=>{
    if(tx.type === "income"){
      stats.income +=
        number(tx.amount);

      stats.reserve +=
        number(tx.reserve);

      const allocationsTotal =
        (tx.allocations || [])
          .reduce(
            (sum,item)=>
              sum + number(item.amount),
            0
          );

      const storedRemainder =
        tx.remainder === undefined ||
        tx.remainder === null
        ?
        Math.max(
          0,
          number(tx.amount) -
          allocationsTotal -
          number(tx.reserve)
        )
        :
        number(tx.remainder);

      stats.free +=
        storedRemainder;

      (tx.allocations || [])
        .forEach(item=>{
          const name =
            item.name ||
            "Без категории";

          stats.allocations[name] =
            (stats.allocations[name] || 0) +
            number(item.amount);
        });
    }

    if(tx.type === "expense"){
      const amount =
        number(tx.amount);

      stats.expenses +=
        amount;

      if(!tx.categoryId){
        stats.free -=
          amount;
      }else{
        const name =
          tx.categoryName ||
          "Без категории";

        stats.allocations[name] =
          (stats.allocations[name] || 0) -
          amount;
      }
    }
  });

  return stats;
}

function allMonths''',
              'monthStats'
          )

          text, label_count = re.subn(
              r'(<div class="label">\s*)ОСТАТОК(\s*</div>)',
              r'\1СВОБОДНЫЕ ДЕНЬГИ\2',
              text,
              count=1,
              flags=re.S
          )
          if label_count != 1:
              raise SystemExit(f'income plan label: expected 1 replacement, got {label_count}')

          replace_once(
              r'function updateIncomePlanUI\(plan\)\{.*?\n\}\n\nfunction saveIncomeFromModal\(plan\)\{',
              '''function updateIncomePlanUI(plan){
  currentIncomePlan =
    clone(plan);

  const data =
    readIncomePlanFromUI();

  const distributed =
    data.allocations.reduce(
      (sum,item)=>
        sum +
        integer(item.amount),
      0
    ) +
    integer(data.reserve);

  const freeMoney =
    integer(plan.total) -
    distributed;

  const differenceEl =
    document.getElementById(
      "planDifference"
    );

  if(differenceEl){
    differenceEl.textContent =
      money(
        Math.max(0,freeMoney),
        document.getElementById(
          "incomeCurrency"
        ).value
      );

    differenceEl.className =
      "value " +
      (
        freeMoney>=0
        ?
        "positive"
        :
        "negative"
      );
  }

  const message =
    document.getElementById(
      "planMessage"
    );

  if(!message){
    return;
  }

  if(freeMoney>=0){
    message.innerHTML = `
      <div class="notice">
        После распределения свободными останется
        <strong>
          ${money(
            freeMoney,
            document.getElementById(
              "incomeCurrency"
            ).value
          )}
        </strong>.
      </div>
    `;
  }else{
    message.innerHTML = `
      <div class="notice danger">
        Распределение превышает доход на
        <strong>
          ${money(
            Math.abs(freeMoney),
            document.getElementById(
              "incomeCurrency"
            ).value
          )}
        </strong>.
      </div>
    `;
  }
}

function saveIncomeFromModal(plan){''',
              'updateIncomePlanUI'
          )

          replace_once(
              r'function saveIncomeFromModal\(plan\)\{.*?\n\}\n\n\n/\* =========================================================\n   EXPENSE PAGE',
              '''function saveIncomeFromModal(plan){
  const profile =
    activeProfile();

  const data =
    readIncomePlanFromUI();

  const validation =
    validatePlan({
      total:plan.total,
      allocations:data.allocations,
      reserve:data.reserve
    });

  if(!validation.valid){
    toast(
      "Распределение превышает сумму дохода."
    );
    return;
  }

  const incomeDate =
    document.getElementById(
      "incomeDate"
    ).value ||
    today();

  createIncomeTransaction(
    profile,
    {
      amount:plan.total,

      source:
        document.getElementById(
          "incomeSource"
        ).value,

      date:
        incomeDate,

      currency:
        document.getElementById(
          "incomeCurrency"
        ).value,

      note:
        document.getElementById(
          "incomeNote"
        ).value,

      allocations:
        data.allocations,

      reserve:
        data.reserve,

      remainder:
        validation.remainder
    }
  );

  saveState();

  closeModal();

  activeMonth =
    monthKey(
      incomeDate
    );

  toast(
    "Доход сохранён."
  );

  activePage =
    "home";

  render();
}


/* =========================================================
   EXPENSE PAGE''',
              'saveIncomeFromModal'
          )

          if text == original:
              raise SystemExit('No changes made')

          path.write_text(text, encoding='utf-8')

      - name: Sanity checks
        shell: bash
        run: |
          grep -q 'storedRemainder' index.html
          grep -q 'remainder:[[:space:]]*$' index.html
          ! grep -q 'stats.allocations\[[[:space:]]*"Свободные деньги"' index.html

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'ARISE Codex'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: separate free money from categories'
          git push origin HEAD:main
