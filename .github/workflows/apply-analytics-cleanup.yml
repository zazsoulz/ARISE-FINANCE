name: Apply guarded Analytics cleanup

on:
  push:
    branches:
      - agent/apply-physical-analytics-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-physical-analytics-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply checked-in fail-closed transform
        run: node scripts/remove-legacy-analytics-source.js --write
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-analytics-cleanup.yml
      - name: Commit guarded cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.html index.html .github/workflows/apply-analytics-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m "Physically remove retired Analytics renderer"
          git push origin HEAD:agent/apply-physical-analytics-cleanup
