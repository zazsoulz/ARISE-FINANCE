name: Apply physical goals cleanup

on:
  push:
    branches:
      - agent/apply-physical-goals-cleanup

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.event.head_commit.message != 'Apply physical goals cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-physical-goals-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded cleanup
        run: node scripts/remove-legacy-goals-source.js --write
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-physical-goals-cleanup.yml
      - name: Commit guarded cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.html index.html .github/workflows/apply-physical-goals-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m "Apply physical goals cleanup"
          git push origin HEAD:agent/apply-physical-goals-cleanup
