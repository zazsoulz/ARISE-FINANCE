name: Financial Core Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/apply-physical-analytics-cleanup

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install smoke-test dependency
        run: npm install --no-save jsdom@26.1.0
      - name: Syntax check
        run: |
          node --check currency-engine.js
          node --check currency-runtime.js
          node --check currency-display.js
          node --check financial-core.js
          node --check goal-lifecycle-core.js
          node --check reserve-lifecycle-core.js
          node --check goal-future-reroute-core.js
          node --check expense-reconciliation.js
          node --check financial-runtime.js
          node --check goal-history.js
          node --check financial-integration.js
          node --check reserve-analytics.js
          node --check reserve-essential-spend.js
          node --check analytics-engine.js
          node --check goal-completion-analytics.js
          node --check analytics-ui.js
          node --check product-rules.js
          node --check navigation-compat.js
          node --check arise-v3.js
          node --check expense-edit-ui.js
          node --check history-inspector.js
          node --check product-ui.js
          node --check reserve-lifecycle-ui.js
          node --check sync-conflict-ui.js
          node --check goal-lifecycle-ui.js
          node --check supabase-public-config.js
          node --check supabase-client.js
          node --check sync-outbox.js
          node --check indexeddb-store.js
          node --check local-account-store.js
          node --check sync-engine.js
          node --check sync-entity-outbox.js
          node --check sync-conflict-policy.js
          node --check sync-pull.js
          node --check transaction-transfer-metadata.js
          node --check sync-conflict-hardening.js
          node --check auth-ui.js
          node --check account-settings.js
          node --check profile-lifecycle.js
          node --check settings-ui.js
          node --check onboarding.js
          node --check runtime-integrity.js
          node --check financial-bootstrap.js
          node --check scripts/build-standalone-preview.js
          node --check scripts/remove-legacy-nav-source.js
          node --check scripts/remove-legacy-home-source.js
          node --check scripts/remove-legacy-income-source.js
          node --check scripts/remove-legacy-goals-source.js
          node --check scripts/remove-legacy-history-source.js
          node --check scripts/remove-legacy-analytics-source.js
          node --check scripts/remove-legacy-settings-source.js
      - name: Physical cleanup guards
        run: |
          node scripts/remove-legacy-nav-source.js --check
          node scripts/remove-legacy-home-source.js --check
          node scripts/remove-legacy-income-source.js --check
          node scripts/remove-legacy-goals-source.js --check
          node scripts/remove-legacy-history-source.js --check
          node scripts/remove-legacy-analytics-source.js --check
          node scripts/remove-legacy-settings-source.js --check
      - name: Regression and UI smoke tests
        run: node --test tests/*.test.js
      - name: Apply guarded Analytics cleanup after verification
        if: github.ref == 'refs/heads/agent/apply-physical-analytics-cleanup'
        run: |
          node scripts/remove-legacy-analytics-source.js --write
          git checkout origin/main -- .github/workflows/test.yml
          rm -f .github/workflows/apply-analytics-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.html index.html .github/workflows/test.yml .github/workflows/apply-analytics-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m "Physically remove retired Analytics renderer"
          git push origin HEAD:agent/apply-physical-analytics-cleanup
