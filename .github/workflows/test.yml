name: Financial Core Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install smoke-test dependency
        run: npm install --no-save jsdom@26.1.0
      - name: Syntax check
        run: |
          node --check currency-engine.js
          node --check currency-runtime.js
          node --check currency-display.js
          node --check financial-core.js
          node --check expense-reconciliation.js
          node --check financial-runtime.js
          node --check financial-integration.js
          node --check canonical-ui-overrides.js
          node --check reserve-analytics.js
          node --check analytics-engine.js
          node --check analytics-ui.js
          node --check product-rules.js
          node --check arise-v3.js
          node --check supabase-public-config.js
          node --check supabase-client.js
          node --check sync-outbox.js
          node --check indexeddb-store.js
          node --check local-account-store.js
          node --check sync-engine.js
          node --check sync-entity-outbox.js
          node --check sync-conflict-policy.js
          node --check sync-pull.js
          node --check auth-ui.js
          node --check account-settings.js
          node --check profile-lifecycle.js
          node --check financial-bootstrap.js
      - name: Regression and UI smoke tests
        run: node --test tests/*.test.js
