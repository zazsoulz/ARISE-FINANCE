name: Fix Navigation Cleanup Tests

on:
  push:
    branches:
      - agent/remove-navigation-compat-helpers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-navigation-compat-helpers
      - name: Update post-cleanup test contracts
        shell: python
        run: |
          from pathlib import Path

          for name in ['browser-smoke.test.js','history-inspector.test.js','profile-isolation.test.js','reserve-settings.test.js']:
              path=Path('tests')/name
              text=path.read_text()
              text=text.replace("'product-rules.js','arise-v3.js'", "'product-rules.js','navigation-compat.js','arise-v3.js'")
              path.write_text(text)

          path=Path('tests/legacy-nav-source-cleanup.test.js')
          text=path.read_text()
          text=text.replace("  assert.match(shell,/function\\s+bindNav\\s*\\(/);\n  assert.match(shell,/function\\s+profileSwitcher\\s*\\(/);\n  assert.match(shell,/function\\s+bindProfileSwitcher\\s*\\(/);", "  assert.doesNotMatch(shell,/function\\s+bindNav\\s*\\(/);\n  assert.doesNotMatch(shell,/function\\s+profileSwitcher\\s*\\(/);\n  assert.doesNotMatch(shell,/function\\s+bindProfileSwitcher\\s*\\(/);")
          path.write_text(text)

          path=Path('tests/navigation-compat.test.js')
          text=path.read_text()
          old="""  for(const helper of ['function bindNav(){','function profileSwitcher(){','function bindProfileSwitcher(){']){\n    assert.ok(shell.includes(helper),`${helper} must remain in compatibility source until its own physical extraction cleanup`);\n  }"""
          new="""  for(const name of ['bindNav','profileSwitcher','bindProfileSwitcher']){\n    assert.doesNotMatch(shell,new RegExp(`\\\\bfunction\\\\s+${name}\\\\s*\\\\(`),`${name} legacy copy must stay physically retired`);\n  }"""
          if old not in text: raise SystemExit('navigation-compat ownership block not found')
          path.write_text(text.replace(old,new))

          path=Path('tests/navigation-compat-transformed-shell-smoke.test.js')
          text=path.read_text()
          text=text.replace("  assert.notEqual(shell,originalShell,'fixture must exercise the post-cleanup shell');", "  assert.equal(shell,originalShell,'current shell must already be physically cleaned');\n  assert.equal(removeNavigationCompatSource(shell),shell,'cleanup must stay idempotent after physical removal');")
          path.write_text(text)

          Path('tests/navigation-compat-source-cleanup.test.js').write_text(r'''const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');

          const shell=fs.readFileSync('app-shell.html','utf8');
          const navigationCompat=fs.readFileSync('navigation-compat.js','utf8');
          const {
            NAV_FUNCTION_BOUNDARY,
            GOAL_CARD_MARKER,
            removeNavigationCompatSource
          }=require('../scripts/remove-navigation-compat-source.js');

          const LEGACY_FUNCTIONS=['bindNav','profileSwitcher','bindProfileSwitcher'];

          function legacyFixture(){
            const boundary=shell.indexOf(GOAL_CARD_MARKER);
            assert.ok(boundary>=0,'GOAL CARD boundary missing from current shell');
            const block=`function bindNav(){\n  return true;\n}\n\nfunction profileSwitcher(){\n  return \"\";\n}\n\nfunction bindProfileSwitcher(){\n  return true;\n}\n\n`;
            return shell.slice(0,boundary)+block+shell.slice(boundary);
          }

          test('navigation compatibility source is owned by navigation-compat.js',()=>{
            for(const name of LEGACY_FUNCTIONS){
              assert.match(navigationCompat,new RegExp(`function\\s+${name}\\s*\\(`));
              assert.match(navigationCompat,new RegExp(`root\\.${name}=${name}`));
              assert.doesNotMatch(shell,new RegExp(`\\bfunction\\s+${name}\\s*\\(`));
            }
          });

          test('cleanup removes only legacy navigation/profile helper block',()=>{
            const fixture=legacyFixture();
            const cleaned=removeNavigationCompatSource(fixture);
            assert.notEqual(cleaned,fixture);
            assert.equal(cleaned,shell);
            for(const name of LEGACY_FUNCTIONS){
              assert.doesNotMatch(cleaned,new RegExp(`\\bfunction\\s+${name}\\s*\\(`));
            }
            assert.ok(cleaned.includes(GOAL_CARD_MARKER));
            assert.ok(cleaned.includes('function goalCard(goal){'));
            assert.ok(cleaned.includes('function openModal(html){'));
            assert.ok(cleaned.includes('.nav{'));
            assert.ok(cleaned.includes('.profile-switch{'));
          });

          test('cleanup is idempotent after physical removal',()=>{
            assert.equal(removeNavigationCompatSource(shell),shell);
          });

          test('cleanup fails closed when an unexpected helper appears in the block',()=>{
            const fixture=legacyFixture();
            const navStart=fixture.indexOf(NAV_FUNCTION_BOUNDARY);
            assert.ok(navStart>=0);
            const injected=fixture.slice(0,navStart+NAV_FUNCTION_BOUNDARY.length)+
              '\nfunction sharedUnexpectedHelper(){}\n'+
              fixture.slice(navStart+NAV_FUNCTION_BOUNDARY.length);
            assert.throws(
              ()=>removeNavigationCompatSource(injected),
              /unexpected helper sharedUnexpectedHelper/
            );
          });

          test('cleanup fails closed when the next boundary is damaged',()=>{
            const fixture=legacyFixture();
            const damaged=fixture.replace(GOAL_CARD_MARKER,'/* damaged goal-card boundary */');
            assert.throws(
              ()=>removeNavigationCompatSource(damaged),
              /GOAL CARD boundary missing/
            );
          });
          '''.replace('          ','').lstrip())
      - name: Remove one-off workflow and commit test updates
        run: |
          git rm .github/workflows/fix-navigation-cleanup-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Align tests with navigation helper retirement"
          git push origin HEAD:agent/remove-navigation-compat-helpers
