name: Apply physical nav cleanup

on:
  push:
    branches:
      - agent/apply-physical-nav-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-physical-nav-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded cleanup
        run: node scripts/remove-legacy-nav-source.js --write app-shell.html index.html
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-physical-nav-cleanup.yml
      - name: Commit transformed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.html index.html .github/workflows/apply-physical-nav-cleanup.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Physically remove legacy navigation source"
          git push origin HEAD:agent/apply-physical-nav-cleanup
