name: Build standalone ARISE preview

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - scripts/build-standalone-preview.js
      - .github/workflows/build-standalone-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build standalone HTML
        run: node scripts/build-standalone-preview.js ARISE-current-standalone.html
      - uses: actions/upload-artifact@v4
        with:
          name: ARISE-current-standalone
          path: ARISE-current-standalone.html
          if-no-files-found: error
