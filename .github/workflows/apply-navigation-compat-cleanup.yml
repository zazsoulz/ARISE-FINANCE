name: Apply Navigation Compat Cleanup

on:
  push:
    branches:
      - agent/remove-navigation-compat-helpers

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-navigation-compat-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded cleanup
        run: node scripts/remove-navigation-compat-source.js --write app-shell.html
      - name: Verify guarded cleanup
        run: node scripts/remove-navigation-compat-source.js --check app-shell.html
      - name: Remove one-off workflow and commit cleanup
        run: |
          git rm .github/workflows/apply-navigation-compat-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.html
          git commit -m "Remove duplicate navigation compat helpers"
          git push origin HEAD:agent/remove-navigation-compat-helpers
