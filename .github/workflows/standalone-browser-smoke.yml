name: Standalone Browser Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build canonical standalone preview
        run: node scripts/build-standalone-preview.js "$RUNNER_TEMP/arise-finance-standalone.html"
      - name: Syntax-check browser smoke
        run: node --check scripts/standalone-browser-smoke.js
      - name: Verify standalone in Chromium at mobile, tablet and desktop sizes
        run: node scripts/standalone-browser-smoke.js "$RUNNER_TEMP/arise-finance-standalone.html" "$RUNNER_TEMP/arise-browser-report.json"
      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: arise-standalone-browser-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/arise-browser-report.json
            ${{ runner.temp }}/arise-standalone-*.png
          if-no-files-found: error
          retention-days: 14
