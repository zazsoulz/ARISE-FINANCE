name: Physical Income Cleanup

on:
  push:
    branches: [agent/physical-remove-legacy-income]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-remove-legacy-income
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded physical income cleanup
        run: node scripts/remove-legacy-income-source.js --write
      - name: Verify exact retirement state
        run: |
          node scripts/remove-legacy-income-source.js --check
          node --test tests/legacy-income-source-cleanup.test.js
      - name: Commit guarded cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.html index.html
          git commit -m "Physically remove legacy income renderer"
          git push origin HEAD:agent/physical-remove-legacy-income
