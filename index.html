<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0f">
<title>ARISE Finance</title>
<style>
html,body{margin:0;min-height:100%;background:#080b0f;color:#f0f2f3;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;font-size:13px;color:#858e98}
</style>
</head>
<body>
<div id="boot">ARISE</div>
<script>
(async function(){
  try{
    const response = await fetch("./app-shell.html",{cache:"no-store"});
    if(!response.ok){
      throw new Error("app-shell.html: HTTP " + response.status);
    }

    let html = await response.text();
    const scriptOpen = "<scr" + "ipt";
    const scriptClose = "</scr" + "ipt>";
    const integration =
      scriptOpen + " src=\"./financial-core.js\">" + scriptClose +
      scriptOpen + " src=\"./financial-integration.js\">" + scriptClose;

    if(/<\/body>/i.test(html)){
      html = html.replace(/<\/body>/i,integration + "</body>");
    }else{
      html += integration;
    }

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById("boot").textContent =
      "ARISE не удалось загрузить приложение.";
  }
})();
</script>
</body>
</html>
