<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0f">
<title>ARISE Finance</title>
<style>
html,body{margin:0;min-height:100%;background:#080b0f;color:#f0f2f3;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;font-size:13px;color:#858e98}
</style>
</head>
<body>
<div id="boot">ARISE</div>
<script>
(async function(){
  try{
    const response=await fetch("./app-shell.html",{cache:"no-store"});
    if(!response.ok) throw new Error("app-shell.html: HTTP "+response.status);

    let html=await response.text();

    const financialMarker=`/* =========================================================\n   FINANCIAL ENGINE\n========================================================= */`;
    const uiMarker=`/* =========================================================\n   UI\n========================================================= */`;
    const initMarker=`/* =========================================================\n   INITIALIZATION\n========================================================= */`;

    const financialStart=html.indexOf(financialMarker);
    const uiStart=html.indexOf(uiMarker);
    if(financialStart<0||uiStart<0||uiStart<=financialStart){throw new Error("ARISE shell financial boundary not found.");}

    html=html.slice(0,financialStart)+`/* Financial state and calculations are provided by the external ARISE runtime. */\n\n`+html.slice(uiStart);

    const scriptCloseTag="</scr"+"ipt>";
    const initStart=html.indexOf(initMarker);
    const scriptEnd=html.lastIndexOf(scriptCloseTag);
    if(initStart<0||scriptEnd<0||scriptEnd<=initStart){throw new Error("ARISE shell initialization boundary not found.");}

    html=html.slice(0,initStart)+`/* Initialization is deferred until the financial runtime is loaded. */\n\n`+html.slice(scriptEnd);

    const scriptOpen="<scr"+"ipt";
    const scriptClose=scriptCloseTag;
    const runtime=
      scriptOpen+" src=\"./financial-core.js\">"+scriptClose+
      scriptOpen+" src=\"./expense-reconciliation.js\">"+scriptClose+
      scriptOpen+" src=\"./financial-runtime.js\">"+scriptClose+
      scriptOpen+" src=\"./financial-integration.js\">"+scriptClose+
      scriptOpen+" src=\"./reserve-analytics.js\">"+scriptClose+
      scriptOpen+" src=\"./product-rules.js\">"+scriptClose+
      scriptOpen+" src=\"./arise-v3.js\">"+scriptClose+
      scriptOpen+" src=\"./arise-v3-api.js\">"+scriptClose+
      scriptOpen+" src=\"./financial-bootstrap.js\">"+scriptClose;

    const bootHide='<style id="arise-boot-hide">html{visibility:hidden}</style>';
    const themeLinks='<link rel="stylesheet" href="./arise-v3.css"><link rel="stylesheet" href="./arise-v3-state.css">';
    if(/<\/head>/i.test(html)) html=html.replace(/<\/head>/i,themeLinks+bootHide+"</head>"); else html=themeLinks+bootHide+html;
    if(/<\/body>/i.test(html)) html=html.replace(/<\/body>/i,runtime+"</body>"); else html+=runtime;

    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.getElementById("boot").textContent="ARISE не удалось загрузить приложение.";
  }
})();
</script>
</body>
</html>
