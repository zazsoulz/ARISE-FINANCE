<script>
try {
  const hasSupabase = false;
  const sb = null;
  const LOCAL_KEY = "arise_finance_local_v3";

  const DEFAULT = {
    profile:{id:"local",name:"Мой профиль",baseCurrency:"RUB",hidden:false},
    settings:{
  basicNeeds:35700,
  family:20000,
  creativeMin:5000,
  creativeTarget:12500,
  freeMin:20000,
  reserveTarget:300000
},
    goals:[
      {id:"reserve",name:"Финансовый резерв",type:"reserve",target:300000,current:0,deadline:"",priority:5,status:"active"},
      {id:"turkey",name:"Турция",type:"goal",target:125000,current:0,deadline:"",priority:4,status:"active"},
      {id:"bmw",name:"BMW G20",type:"goal",target:2000000,current:0,deadline:"",priority:2,status:"active"}
    ],
    transactions:[],
    allocations:[],
    monthlyPlans:[],
    currencyRates:{}
  };

  function clone(x){
    return JSON.parse(JSON.stringify(x));
  }

  function safeId(){
    return "id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10);
  }

  function normalizeState(raw){
    const base=clone(DEFAULT);
    const src=raw&&typeof raw==="object"?raw:{};

    const out={
      ...base,
      ...src,
      profile:{
        ...base.profile,
        ...(src.profile&&typeof src.profile==="object"?src.profile:{})
      },
      settings:{
        ...base.settings,
        ...(src.settings&&typeof src.settings==="object"?src.settings:{})
      }
    };

    out.goals=Array.isArray(src.goals)
      ? src.goals.filter(Boolean).map(g=>({
          id:g.id||safeId(),
          name:g.name||"Цель",
          type:g.type||"goal",
          target:Number(g.target)||0,
          current:Number(g.current)||0,
          deadline:g.deadline||"",
          priority:Number(g.priority)||3,
          status:g.status||"active",
          ...g
        }))
      : clone(base.goals);

    out.transactions=Array.isArray(src.transactions)
      ? src.transactions.filter(Boolean)
      : [];

    out.allocations=Array.isArray(src.allocations)
      ? src.allocations.filter(Boolean)
      : [];

    out.monthlyPlans=Array.isArray(src.monthlyPlans)
      ? src.monthlyPlans.filter(Boolean)
      : [];

    out.currencyRates=
      src.currencyRates&&
      typeof src.currencyRates==="object"&&
      !Array.isArray(src.currencyRates)
        ? src.currencyRates
        : {};

    if(!out.profile.baseCurrency){
      out.profile.baseCurrency="RUB";
    }

    return out;
  }

  function loadLocal(){
  try{
    const raw=window.localStorage
      ? window.localStorage.getItem(LOCAL_KEY)
      : null;

    if(!raw){
      return clone(DEFAULT);
    }

    return normalizeState(JSON.parse(raw));

  }catch(e){
    console.error("ARISE loadLocal error:", e);
    return clone(DEFAULT);
  }
}

  function saveLocal(){
  try{
    if(!window.localStorage){
      return false;
    }

    window.localStorage.setItem(
      LOCAL_KEY,
      JSON.stringify(normalizeState(A))
    );

    return true;

  }catch(e){
    console.error("ARISE saveLocal error:", e);
    return false;
  }
}

  let A=loadLocal();
  // =========================
  // JS TEST 4 — FINANCIAL ENGINE
  // =========================

  function num(v){
    const n=Number(v);
    return Number.isFinite(n)?n:0;
  }

  function sum(arr,fn){
    return arr.reduce((s,x)=>s+num(fn(x)),0);
  }

  function getActiveGoals(state){
    return (state.goals||[])
      .filter(g=>
        g &&
        g.status!=="completed" &&
        g.type!=="reserve"
      )
      .sort((a,b)=>num(b.priority)-num(a.priority));
}
function distributeGoalBudget(
  budget,
  goals,
  existingGoals=[]
){

  let amountLeft=Math.max(
    0,
    Math.round(num(budget))
  );

  if(amountLeft<=0 || !goals.length){
    return [];
  }

  const alreadyAllocated=new Map();

  (existingGoals||[]).forEach(g=>{
    alreadyAllocated.set(
      g.id,
      num(g.amount)
    );
  });

  const prepared=goals
    .map(goal=>{

      const target=num(goal.target);
      const current=num(goal.current);

      const already=num(
        alreadyAllocated.get(goal.id)
      );

      const need=Math.max(
        0,
        target-current-already
      );

      if(need<=0){
        return null;
      }

      const priority=Math.max(
        1,
        num(goal.priority)||1
      );

      const progress=target>0
        ? Math.min(
            1,
            (current+already)/target
          )
        : 0;

      /*
       * Приоритет — основной фактор.
       * Чем ближе цель к завершению,
       * тем немного выше её вес.
       */
      const urgency=1+(progress*0.5);

      return {
        goal,
        need,
        weight:priority*urgency
      };

    })
    .filter(Boolean);

  if(!prepared.length){
    return [];
  }

  /*
   * Распределяем бюджет пропорционально весам.
   */
  const totalWeight=prepared.reduce(
    (s,item)=>s+item.weight,
    0
  );

  const result=prepared.map(item=>{

    const raw=
      amountLeft*
      (item.weight/totalWeight);

    /*
     * Округляем цели до 100 ₽.
     * Но не выдаём больше необходимого.
     */
    const rounded=
      Math.floor(raw/100)*100;

    const amount=Math.min(
      item.need,
      rounded
    );

    return {
      id:item.goal.id,
      name:item.goal.name,
      amount,
      needBefore:item.need,
      needAfter:item.need-amount,
      raw
    };

  });

  /*
   * Если из-за округления остались деньги,
   * распределяем их по 100 ₽ начиная
   * с наиболее приоритетной цели.
   */
  let used=result.reduce(
    (s,g)=>s+g.amount,
    0
  );

  let leftover=amountLeft-used;

  while(leftover>=100){

    const candidates=result
      .map(item=>{
        const goal=goals.find(
          g=>g.id===item.id
        );

        if(!goal || item.needAfter<100){
          return null;
        }

        return {
          item,
          priority:num(goal.priority)||1
        };
      })
      .filter(Boolean)
      .sort((a,b)=>{
        if(b.priority!==a.priority){
          return b.priority-a.priority;
        }

        return b.item.raw-a.item.raw;
      });

    if(!candidates.length){
      break;
    }

    const selected=candidates[0].item;

    selected.amount+=100;
    selected.needAfter-=100;
    leftover-=100;
    used+=100;
  }

  /*
   * Последние 1–99 ₽ остаются вызывающей системе.
   */
  return result.filter(
    g=>g.amount>0
  );
}
  function calculateFinancialPlan(income,state=A,planDate=""){

  const total=num(income);

  if(total<=0){
    return {
      income:0,
      basic:0,
      family:0,
      creative:0,
      free:0,
      reserve:0,
      goals:[],
      distributed:0,
      remaining:0
    };
  }

  const settings=state.settings||{};

  // =================================
  // 1. ОПРЕДЕЛЯЕМ МЕСЯЦ
  // =================================

  const date=planDate ||
    new Date().toISOString().slice(0,10);

  const month=date.slice(0,7);

  // =================================
  // 2. СКОЛЬКО ФИКСИРОВАННЫХ
  //    РАСХОДОВ УЖЕ ПОКРЫТО В МЕСЯЦЕ
  // =================================

  const monthPlans=(state.monthlyPlans||[])
    .filter(p=>
      p &&
      (p.month===month ||
       (p.date&&String(p.date).slice(0,7)===month))
    );

  const alreadyBasic=sum(
    monthPlans,
    p=>p.basic
  );

  const alreadyFamily=sum(
    monthPlans,
    p=>p.family
  );

  // =================================
  // 3. МЕСЯЧНЫЕ ЛИМИТЫ
  // =================================

  const basicTarget=Math.max(
    0,
    num(settings.basicNeeds)
  );

  const familyTarget=Math.max(
    0,
    num(settings.family)
  );

  // Сколько ещё реально нужно
  // покрыть фиксированным категориям.

  const basicNeed=Math.max(
    0,
    basicTarget-alreadyBasic
  );

  const familyNeed=Math.max(
    0,
    familyTarget-alreadyFamily
  );

  // =================================
  // 4. ПОКРЫВАЕМ ФИКСИРОВАННЫЕ
  // =================================

  let remaining=total;

  const basic=Math.min(
    remaining,
    basicNeed
  );

  remaining-=basic;

  const family=Math.min(
    remaining,
    familyNeed
  );

  remaining-=family;

  // =================================
  // 5. ПРОЦЕНТЫ ОТ ОСТАТКА
  // =================================

  const reservePercent=0.30;
  const goalsPercent=0.40;
  const creativePercent=0.10;
  const freePercent=0.20;

  const reserveRaw=remaining*reservePercent;
  const goalsRaw=remaining*goalsPercent;
  const creativeRaw=remaining*creativePercent;
  const freeRaw=remaining*freePercent;

  // =================================
  // 6. ОКРУГЛЕНИЕ
  // =================================

  let reserve=Math.round(reserveRaw);
  let creative=Math.round(creativeRaw);
  let free=Math.round(freeRaw);

  // =================================
  // 7. РЕЗЕРВ
  // =================================

  const activeGoals=getActiveGoals(state);

  const currentReserve=sum(
    state.goals||[],
    g=>g.type==="reserve"?g.current:0
  );

  const reserveTarget=Math.max(
    0,
    num(settings.reserveTarget)
  );

  const reserveNeed=Math.max(
    0,
    reserveTarget-currentReserve
  );

  reserve=Math.min(
    reserve,
    reserveNeed
  );

  // =================================
  // 8. ЦЕЛИ
  // =================================

  const goalBudget=Math.round(
    goalsRaw
  );

  const goals=distributeGoalBudget(
    goalBudget,
    activeGoals
  );

  // =================================
  // 9. БАЛАНС
  // =================================

  let distributed=
    basic+
    family+
    reserve+
    creative+
    free+
    goals.reduce(
      (s,g)=>s+num(g.amount),
      0
    );

  let difference=total-distributed;

  // =================================
  // 10. ЕСЛИ РЕЗЕРВ ДОСТИГНУТ —
  //     ОСВОБОДИВШИЕСЯ ДЕНЬГИ В ЦЕЛИ
  // =================================

  if(difference>0){

    const extraGoals=distributeGoalBudget(
      difference,
      activeGoals,
      goals
    );

    extraGoals.forEach(extra=>{

      const existing=goals.find(
        g=>g.id===extra.id
      );

      if(existing){

        existing.amount+=extra.amount;

        existing.needAfter=Math.max(
          0,
          existing.needAfter-extra.amount
        );

      }else{

        goals.push(extra);

      }

    });

    distributed=
      basic+
      family+
      reserve+
      creative+
      free+
      goals.reduce(
        (s,g)=>s+num(g.amount),
        0
      );

    difference=total-distributed;
  }

  // =================================
  // 11. ПОСЛЕДНИЕ РУБЛИ → СВОБОДНЫЕ
  // =================================

  if(difference!==0){

    free+=difference;
    distributed+=difference;

  }

  return {

    income:total,

    basic,
    family,

    creative,
    free,
    reserve,

    goals,

    distributed,

    remaining:total-distributed

  };
}

  function applyFinancialPlan(plan,state=A,meta={}){
  if(!plan||!state)return false;

  const now=new Date();
  const month=now.toISOString().slice(0,7);

  state.monthlyPlans=Array.isArray(state.monthlyPlans)
    ? state.monthlyPlans
    : [];

  state.allocations=Array.isArray(state.allocations)
    ? state.allocations
    : [];

  state.transactions=Array.isArray(state.transactions)
    ? state.transactions
    : [];

  const source=(meta.source||"Без источника").trim();
  const date=meta.date||now.toISOString().slice(0,10);

  // Записываем сам доход
  state.transactions.push({
    id:safeId(),
    type:"income",
    amount:plan.income,
    source,
    date,
    month,
    createdAt:now.toISOString()
  });

  // Сохраняем рассчитанный план
  const planRecord={

    basic:plan.basic,
    family:plan.family,
    creative:plan.creative,

    reserve:plan.reserve,
    goals:clone(plan.goals),
    distributed:plan.distributed,
    remaining:plan.remaining,
    createdAt:now.toISOString()
  };

  state.monthlyPlans.push(planRecord);

  // Резерв
  if(plan.reserve>0){
    const reserveGoal=state.goals.find(
      g=>g.type==="reserve"
    );

    if(reserveGoal){
      reserveGoal.current=
        num(reserveGoal.current)+plan.reserve;
    }
  }

  // Цели
  plan.goals.forEach(item=>{
    const goal=state.goals.find(
      g=>g.id===item.id
    );

    if(goal){
      goal.current=
        num(goal.current)+num(item.amount);

      if(num(goal.current)>=num(goal.target)){
        goal.current=num(goal.target);
        goal.status="completed";
      }
    }
  });

  saveLocal();
  return true;

  function rebalanceFinancialPlan(basePlan,editedValues,state=A){

  if(!basePlan || !editedValues){
    return basePlan;
  }

  const income=num(basePlan.income);

  const result={
    ...clone(basePlan),
    goals:[],
    distributed:0,
    remaining:0
  };

  // =================================
  // 1. Фиксированные категории
  // =================================

  result.basic=Math.max(
    0,
    num(editedValues.basic)
  );

  result.family=Math.max(
    0,
    num(editedValues.family)
  );

  // =================================
  // 2. Редактируемые категории
  // =================================

  result.creative=Math.max(
    0,
    num(editedValues.creative)
  );

  result.free=Math.max(
    0,
    num(editedValues.free)
  );

  result.reserve=Math.max(
    0,
    num(editedValues.reserve)
  );

  // =================================
  // 3. Ручные значения целей
  // =================================

  const editedGoals=Array.isArray(editedValues.goals)
    ? editedValues.goals
    : [];

  // =================================
  // 4. Считаем общую сумму категорий
  // =================================

  let allocated=
    result.basic+
    result.family+
    result.creative+
    result.free+
    result.reserve;

  // =================================
  // 5. Добавляем цели
  // =================================

  const activeGoals=getActiveGoals(state);

  activeGoals.forEach(goal=>{

    const edited=editedGoals.find(
      g=>g.id===goal.id
    );

    const amount=edited
      ? Math.max(0,num(edited.amount))
      : 0;

    const target=num(goal.target);
    const current=num(goal.current);

    const need=Math.max(
      0,
      target-current
    );

    const finalAmount=Math.min(
      amount,
      need
    );

    if(finalAmount>0){

      result.goals.push({
        id:goal.id,
        name:goal.name,
        amount:finalAmount,
        needBefore:need,
        needAfter:need-finalAmount
      });

      allocated+=finalAmount;
    }
  });

  // =================================
  // 6. Проверяем баланс
  // =================================

  result.distributed=allocated;

  result.remaining=
    income-allocated;

  return result;
}

        0,
        needBefore-amount
      )
    });

  });

  /*
   * Финальный расчёт.
   * ВСЕ категории + ВСЕ цели должны
   * участвовать в общей сумме.
   */

  editedPlan.distributed=
    editedPlan.basic+
    editedPlan.family+
    editedPlan.creative+
    editedPlan.free+
    editedPlan.reserve+
    editedPlan.goals.reduce(
      (total,goal)=>total+num(goal.amount),
      0
    );

  editedPlan.remaining=
    income-editedPlan.distributed;

  return editedPlan;
}
function validateEditedPlan(plan){

  if(!plan){
    return {
      valid:false,
      reason:"План отсутствует."
    };
  }

  const income=num(plan.income);
  const distributed=num(plan.distributed);
  const remaining=income-distributed;

  if(income<=0){
    return {
      valid:false,
      reason:"Доход должен быть больше 0 ₽."
    };
  }

  if(distributed<0){
    return {
      valid:false,
      reason:"Распределение не может быть отрицательным."
    };
  }

  if(remaining<0){
    return {
      valid:false,
      reason:"Распределено больше, чем доступный доход."
    };
  }

  return {
    valid:true,
    reason:"",
    income,
    distributed,
    remaining
  };
}
