<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ARISE FINANCE</title>
<style>
:root{
 --bg:#090c11;--panel:#10151d;--panel2:#141b24;--line:#222b36;--text:#eef2f6;--muted:#8d98a7;
 --accent:#9aa8c5;--accent2:#c7bda9;--good:#9bbfae;--warn:#d4b78c;--danger:#d59a9a;
 --radius:22px;--shadow:0 20px 70px rgba(0,0,0,.28)
}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:
 radial-gradient(900px 500px at 90% -10%,rgba(139,157,190,.10),transparent 65%),
 radial-gradient(700px 500px at -10% 40%,rgba(187,166,135,.07),transparent 65%),var(--bg);
 color:var(--text);font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8290ad;outline-offset:2px}
.app{min-height:100vh}.shell{max-width:1180px;margin:auto;padding:20px 18px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{letter-spacing:.18em;font-size:13px;font-weight:800}.brand span{color:var(--muted);font-weight:600}
.profile{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);background:rgba(16,21,29,.78);border-radius:999px;color:var(--text)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#8f9bb2,#5e6b80);color:#0b0e13;font-size:12px;font-weight:800}
.nav{position:sticky;top:8px;z-index:20;display:flex;gap:7px;padding:7px;margin-bottom:18px;border:1px solid rgba(255,255,255,.06);background:rgba(12,16,22,.82);backdrop-filter:blur(20px);border-radius:18px;overflow:auto}
.nav button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:13px;font-size:13px}
.nav button.active{background:#1b232e;color:var(--text);box-shadow:inset 0 1px rgba(255,255,255,.06)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}.col-4{grid-column:span 4}
.card{background:linear-gradient(180deg,rgba(20,27,36,.96),rgba(15,20,27,.96));border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);animation:rise .38s ease both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.kicker{color:var(--muted);font-size:12px;letter-spacing:.05em}.value{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.035em;margin-top:8px}.sub{font-size:12px;color:var(--muted);margin-top:7px}
h1{font-size:28px;letter-spacing:-.04em;margin:0 0 5px}h2{font-size:17px;margin:0 0 15px;letter-spacing:-.02em}h3{font-size:14px;margin:18px 0 10px}
.row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.055)}.row:last-child{border-bottom:0}
.muted{color:var(--muted)}.tiny{font-size:11px}.positive{color:var(--good)}.negative{color:var(--danger)}.warning{color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--line);border-radius:13px;padding:11px 14px;background:#171e27;color:var(--text);transition:.22s}.btn:hover{transform:translateY(-1px);background:#1d2631}.btn.primary{background:#d8dde5;color:#111720;border-color:#d8dde5;font-weight:800}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);background:#0c1118;color:var(--text);border-radius:13px;padding:12px 13px}.field small{color:var(--muted);font-size:10px}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:10px;color:var(--muted);white-space:nowrap}
.progress{height:8px;background:#202833;border-radius:99px;overflow:hidden;margin:10px 0 7px}.bar{height:100%;width:0;background:linear-gradient(90deg,#7787a4,#b3a98f);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.goal{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.055)}.goal:last-child{border-bottom:0}
.goal-head{display:flex;justify-content:space-between;gap:10px}.goal-name{font-weight:700}.goal-meta{font-size:11px;color:var(--muted);margin-top:3px}
.chart{height:210px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.chart-line{fill:none;stroke:#b7c2d3;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:800;stroke-dashoffset:800;animation:draw 1.2s ease forwards}.chart-fill{fill:url(#g)}@keyframes draw{to{stroke-dashoffset:0}}
.bar-chart{display:flex;align-items:end;gap:8px;height:160px;padding-top:15px}.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:end}.bar-col{width:100%;max-width:34px;background:linear-gradient(180deg,#9aa8c5,#59677c);border-radius:8px 8px 3px 3px;min-height:3px;animation:barIn .8s ease both;transform-origin:bottom}.bar-label{font-size:9px;color:var(--muted)}@keyframes barIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.alloc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.alloc{padding:13px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.015)}.alloc .amount{font-size:17px;font-weight:800;margin-top:5px}
.notice{padding:13px 14px;border-radius:15px;background:rgba(154,168,197,.07);border:1px solid rgba(154,168,197,.16);color:#cbd4e2;font-size:12px;line-height:1.55}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}.event{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.055)}.event:last-child{border-bottom:0}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none}.bottom-inner{pointer-events:auto;display:flex;gap:8px;padding:7px;border:1px solid var(--line);background:rgba(12,16,22,.9);backdrop-filter:blur(20px);border-radius:18px;box-shadow:var(--shadow)}.bottom button{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:12px}.bottom button.active{background:#1a222d;color:var(--text)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(7px);z-index:60;display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#10151d;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.55);animation:rise .25s ease}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(460px,100%);padding:28px;border:1px solid var(--line);border-radius:28px;background:rgba(15,20,27,.92);box-shadow:var(--shadow);backdrop-filter:blur(20px)}.auth-logo{font-size:14px;letter-spacing:.22em;font-weight:800;margin-bottom:40px}.auth-title{font-size:31px;letter-spacing:-.05em;font-weight:800}.auth-copy{color:var(--muted);font-size:13px;line-height:1.6;margin:8px 0 24px}.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.auth-grid .btn{padding:12px 8px}.separator{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10px;margin:17px 0}.separator:before,.separator:after{content:"";height:1px;background:var(--line);flex:1}
.onboarding{min-height:100vh;display:grid;place-items:center;padding:20px}.on-card{width:min(680px,100%);border:1px solid var(--line);border-radius:28px;background:rgba(15,20,27,.96);padding:25px;box-shadow:var(--shadow)}.steps{display:flex;gap:6px;margin-bottom:24px}.step{height:3px;flex:1;background:#242c37;border-radius:9px}.step.on{background:#aeb9ca}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{padding:14px;border:1px solid var(--line);border-radius:15px;background:#0c1118;color:var(--text);text-align:left}.choice.selected{border-color:#aeb9ca;background:#1b232e}
.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%) translateY(15px);z-index:100;background:#e1e5eb;color:#111720;padding:11px 14px;border-radius:13px;font-size:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){.shell{padding:14px 12px 105px}.grid{grid-template-columns:1fr 1fr}.col-12,.col-8,.col-6,.col-4{grid-column:span 2}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.value{font-size:27px}.nav{top:4px}.hide-mobile{display:none}.alloc-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="root"><div class="auth"><div class="auth-card"><div class="auth-logo">ARISE FINANCE</div><div class="auth-title">Запуск ARISE…</div><div class="auth-copy">Подготавливаем финансовую систему.</div></div></div></div><div id="toast" class="toast"></div>
<script>
const hasSupabase = false;
const sb = null;
const LOCAL_KEY="arise_finance_local_v3";
const DEFAULT={
 profile:{id:"local",name:"Мой профиль",baseCurrency:"RUB",hidden:false},
 settings:{family:20000,creativeMin:5000,creativeTarget:12500,freeMin:20000,reserveTarget:300000},
 goals:[
  {id:"reserve",name:"Финансовый резерв",type:"reserve",target:300000,current:0,deadline:"",priority:5,status:"active"},
  {id:"turkey",name:"Турция",type:"goal",target:125000,current:0,deadline:"",priority:4,status:"active"},
  {id:"bmw",name:"BMW G20",type:"goal",target:2000000,current:0,deadline:"",priority:2,status:"active"}
 ],
 transactions:[],allocations:[],monthlyPlans:[],currencyRates:{}
};
let A=loadLocal(), page="home", onboardingStep=0, onboarding={};

function clone(x){return JSON.parse(JSON.stringify(x))}
function safeId(){try{if(globalThis.crypto&&typeof globalThis.crypto.randomUUID==="function")return globalThis.crypto.randomUUID()}catch(e){}return "id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10)}
function normalizeState(raw){
 const base=clone(DEFAULT), src=raw&&typeof raw==="object"?raw:{};
 const out={...base,...src,profile:{...base.profile,...(src.profile&&typeof src.profile==="object"?src.profile:{})},settings:{...base.settings,...(src.settings&&typeof src.settings==="object"?src.settings:{})}};
 out.goals=Array.isArray(src.goals)?src.goals.filter(Boolean).map(g=>({id:g.id||safeId(),name:g.name||"Цель",type:g.type||"goal",target:Number(g.target)||0,current:Number(g.current)||0,deadline:g.deadline||"",priority:Number(g.priority)||3,status:g.status||"active",...g})):clone(base.goals);
 out.transactions=Array.isArray(src.transactions)?src.transactions.filter(Boolean):[];
 out.allocations=Array.isArray(src.allocations)?src.allocations.filter(Boolean):[];
 out.monthlyPlans=Array.isArray(src.monthlyPlans)?src.monthlyPlans.filter(Boolean):[];
 out.currencyRates=src.currencyRates&&typeof src.currencyRates==="object"&&!Array.isArray(src.currencyRates)?src.currencyRates:{};
 if(!out.profile.baseCurrency)out.profile.baseCurrency="RUB";
 return out;
}
function loadLocal(){
 try{
  const raw=localStorage.getItem(LOCAL_KEY);
  return normalizeState(raw?JSON.parse(raw):null);
 }catch(e){
  try{localStorage.removeItem(LOCAL_KEY)}catch(_){}
  return clone(DEFAULT);
 }
}
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(normalizeState(A)));return true}catch(e){return false}}
function money(n,c=A.profile.baseCurrency){if(A.profile.hidden)return "••••••";return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(Math.round(Number(n)||0))+" "+c}
function fmt(n,c){return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(Math.round(Number(n)||0))+" "+c}
function today(){return new Date().toISOString().slice(0,10)}
function month(){return today().slice(0,7)}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function pct(a,b){return b?Math.max(0,Math.min(100,a/b*100)):0}
function escape(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function currentIncome(){return A.transactions.filter(x=>x.type==="income"&&x.date.startsWith(month())).reduce((a,x)=>a+x.amount,0)}
function totalIncome(){return A.transactions.filter(x=>x.type==="income").reduce((a,x)=>a+x.amount,0)}
function totalExpense(){return A.transactions.filter(x=>x.type==="expense").reduce((a,x)=>a+x.amount,0)}
function activeGoals(){return A.goals.filter(g=>g.status!=="completed"&&g.current<g.target)}
function priorityScore(g){
 const remain=Math.max(0,g.target-g.current), progress=g.target?remain/g.target:1;
 let urgency=0;
 if(g.deadline){const days=Math.max(1,(new Date(g.deadline)-new Date())/86400000);urgency=Math.min(2,365/days)}
 return Math.max(.1,g.priority)*(0.65+progress*.45+urgency*.25)
}
/* ARISE financial engine:
   fixed blocks first; free money is intentionally not managed further.
   Remaining pool is dynamically weighted by user priority, goal proximity and deadline.
*/
function plan(income, overridePriorities={}){
 income=Number(income)||0; const s=A.settings;
 const fixedBase=35700, family=s.family;
 const creative=Math.min(Math.max(s.creativeMin,s.creativeTarget),Math.max(s.creativeMin,income-fixedBase-family-s.freeMin));
 let pool=Math.max(0,income-fixedBase-family-creative-s.freeMin);
 const out={base:fixedBase,family,creative,free:s.freeMin,reserve:0,goals:[]};
 const goals=activeGoals().map(g=>({...g,priority:Number(overridePriorities[g.id]??g.priority)}));
 const scored=goals.map(g=>({g,score:priorityScore(g)})); const sum=scored.reduce((a,x)=>a+x.score,0);
 scored.sort((a,b)=>b.score-a.score);
 for(const item of scored){
   if(pool<=0)break;
   const need=Math.max(0,item.g.target-item.g.current);
   const share=sum?pool*(item.score/sum):0;
   const amount=Math.min(need,share);
   if(amount>0){out.goals.push({id:item.g.id,name:item.g.name,amount});pool-=amount}
 }
 // redistribute residual after a goal is completed, highest current score first
 let guard=0;
 while(pool>0.5 && guard++<20){
   const open=activeGoals().filter(g=>!out.goals.find(x=>x.id===g.id&&x.amount>=g.target-g.current));
   if(!open.length)break;
   const best=open.sort((a,b)=>priorityScore(b)-priorityScore(a))[0], need=Math.max(0,best.target-best.current-(out.goals.find(x=>x.id===best.id)?.amount||0));
   if(need<=0)continue;
   const add=Math.min(need,pool); let row=out.goals.find(x=>x.id===best.id);
   if(row)row.amount+=add;else out.goals.push({id:best.id,name:best.name,amount:add}); pool-=add;
 }
 out.free+=Math.max(0,pool);
 out.total=income;
 return out
}
function planRows(p){return [{n:"Обязательная база",v:p.base},{n:"Семья",v:p.family},{n:"Творчество",v:p.creative},{n:"Свободные деньги",v:p.free},...p.goals.map(g=>({n:g.name,v:g.amount}))]}
function nav(){
 const tabs=[["home","Главная"],["income","Доходы"],["expenses","Расходы"],["calendar","Календарь"],["goals","Цели"],["whatif","Что если?"],["settings","Настройки"]];
 return `<div class="nav">${tabs.map(([id,n])=>`<button class="${page===id?"active":""}" onclick="go('${id}')">${n}</button>`).join("")}</div>`
}
function bottom(){
 return `<div class="bottom"><div class="bottom-inner">${[["home","Главная"],["income","Доход"],["goals","Цели"],["whatif","Сценарий"],["settings","Профиль"]].map(([id,n])=>`<button class="${page===id?"active":""}" onclick="go('${id}')">${n}</button>`).join("")}</div></div>`
}
function top(){return `<div class="top"><div><div class="brand">ARISE <span>FINANCE</span></div></div><button class="profile" onclick="profileMenu()"><span class="avatar">${escape((A.profile.name||"A").slice(0,1).toUpperCase())}</span><span>${escape(A.profile.name)}</span><span class="muted">⌄</span></button></div>`}
function shell(content){document.getElementById("root").innerHTML=`<div class="app"><div class="shell">${top()}${nav()}${content}</div>${bottom()}</div>`}
function home(){
 const inc=currentIncome(), p=plan(inc||150000), goals=A.goals;
 const months=monthlyIncome();
 shell(`<div class="grid">
  <div class="card col-8"><div class="kicker">СЕЙЧАС</div><h1>Финансовая картина</h1><div class="value">${money(inc)}</div><div class="sub">доход за текущий месяц · ${A.profile.baseCurrency}</div>
   <div class="actions"><button class="btn primary" onclick="go('income')">Добавить доход</button><button class="btn" onclick="showPlan(${inc||150000})">Посмотреть план</button></div>
  </div>
  <div class="card col-4"><div class="kicker">СОСТОЯНИЕ</div><div class="value">${money(totalIncome()-totalExpense())}</div><div class="sub">чистый поток за всю историю</div><div class="actions"><button class="btn ghost" onclick="toggleHidden()">Скрыть суммы</button></div></div>
  <div class="card col-6"><h2>Цели</h2>${goals.slice(0,4).map(goalCard).join("")}<button class="btn ghost" onclick="go('goals')">Все цели →</button></div>
  <div class="card col-6"><h2>Динамика дохода</h2>${lineChart(months)}</div>
  <div class="card col-12"><h2>Рекомендуемый план · ${money(inc||150000)}</h2><div class="alloc-grid">${planRows(p).map(x=>`<div class="alloc"><div class="kicker">${escape(x.n)}</div><div class="amount">${money(x.v)}</div></div>`).join("")}</div>
   <div class="notice" style="margin-top:12px">ARISE предлагает распределение с учётом приоритетов, близости целей и сроков. Вы можете изменить его до подтверждения.</div>
  </div>
 </div>`)
}
function goalCard(g){
 const progress=pct(g.current,g.target), remain=Math.max(0,g.target-g.current);
 return `<div class="goal"><div class="goal-head"><div><div class="goal-name">${escape(g.name)}</div><div class="goal-meta">${g.deadline?`до ${g.deadline} · `:""}приоритет ${g.priority}</div></div><div><b>${money(g.current)}</b><span class="muted"> / ${money(g.target)}</span></div></div><div class="progress"><div class="bar" style="width:${progress}%"></div></div><div class="goal-meta">${progress.toFixed(0)}% · осталось ${money(remain)}</div></div>`
}
function monthlyIncome(){
 const map={};A.transactions.filter(x=>x.type==="income").forEach(x=>{map[x.date.slice(0,7)]=(map[x.date.slice(0,7)]||0)+x.amount});
 const keys=Object.keys(map).sort().slice(-7);return keys.map(k=>({k,v:map[k]}))
}
function lineChart(data){
 if(!data.length)return '<div class="empty">Добавь доходы — здесь появится динамика.</div>';
 const max=Math.max(...data.map(x=>x.v),1), w=700,h=190,pad=10, step=(w-pad*2)/Math.max(1,data.length-1);
 const pts=data.map((x,i)=>`${pad+i*step},${h-pad-(x.v/max)*(h-pad*2)}`).join(" ");
 return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8f9db6" stop-opacity=".22"/><stop offset="1" stop-color="#8f9db6" stop-opacity="0"/></linearGradient></defs><polyline class="chart-line" points="${pts}"/><polygon class="chart-fill" points="${pts} ${w-pad},${h} ${pad},${h}"/></svg></div><div class="row tiny">${data.map(x=>`<span>${x.k}</span><b>${money(x.v)}</b>`).join("")}</div>`
}
function incomePage(){
 const list=A.transactions.filter(x=>x.type==="income").sort((a,b)=>b.date.localeCompare(a.date));
 shell(`<div class="grid"><div class="card col-6"><h2>Новый доход</h2><div class="form">
  <div class="field"><label>Сумма</label><input id="ia" type="number" placeholder="150000"></div>
  <div class="field"><label>Дата</label><input id="idate" type="date" value="${today()}"></div>
  <div class="field"><label>Источник</label><input id="isrc" placeholder="Работа, подработка..."></div>
  <div class="field"><label>Валюта</label><select id="icur">${currencies().map(c=>`<option>${c}</option>`).join("")}</select></div>
 </div><div class="actions"><button class="btn primary" onclick="addIncome()">Предложить план</button></div></div>
 <div class="card col-6"><h2>Доход по месяцам</h2>${barChart(monthlyIncome())}</div>
 <div class="card col-12"><h2>История доходов</h2>${list.length?list.map(x=>`<div class="event"><div><b class="positive">+ ${fmt(x.amount,x.currency||A.profile.baseCurrency)}</b><div class="tiny muted">${x.date} · ${escape(x.source||"Без источника")}</div></div><span class="pill">${x.planStatus==="confirmed"?"Распределено":"Без распределения"}</span></div>`).join(""):'<div class="empty">Доходов пока нет.</div>'}</div></div>`)
}
function barChart(data){
 if(!data.length)return '<div class="empty">Нет данных</div>';
 const max=Math.max(...data.map(x=>x.v),1);
 return `<div class="bar-chart">${data.map(x=>`<div class="bar-item"><div class="bar-col" style="height:${Math.max(3,x.v/max*125)}px"></div><div class="bar-label">${x.k.slice(5)}</div></div>`).join("")}</div>`
}
function expenses(){
 const list=A.transactions.filter(x=>x.type==="expense").sort((a,b)=>b.date.localeCompare(a.date));
 shell(`<div class="grid"><div class="card col-6"><h2>Добавить расход</h2><div class="form">
  <div class="field"><label>Сумма</label><input id="ea" type="number" placeholder="5000"></div><div class="field"><label>Дата</label><input id="edate" type="date" value="${today()}"></div>
  <div class="field full"><label>Комментарий</label><input id="enote" placeholder="Не обязательно"></div>
 </div><div class="actions"><button class="btn primary" onclick="addExpense()">Сохранить расход</button></div><div class="notice" style="margin-top:12px">Свободные деньги остаются под твоим контролем. ARISE не пытается распределять их по категориям.</div></div>
 <div class="card col-6"><h2>Расходы</h2><div class="value">${money(totalExpense())}</div><div class="sub">за всю историю</div></div>
 <div class="card col-12"><h2>История расходов</h2>${list.length?list.map(x=>`<div class="event"><div><b class="negative">− ${fmt(x.amount,x.currency||A.profile.baseCurrency)}</b><div class="tiny muted">${x.date} · ${escape(x.note||"Расход")}</div></div><button class="btn ghost danger" onclick="removeTx('${x.id}')">Удалить</button></div>`).join(""):'<div class="empty">Расходов пока нет.</div>'}</div></div>`)
}
function calendar(){
 const a=A.transactions.filter(x=>x.date.startsWith(month())).sort((x,y)=>x.date.localeCompare(y.date));
 shell(`<div class="card"><h2>Календарь · ${month()}</h2>${a.length?a.map(x=>`<div class="event"><div><b class="${x.type==="income"?"positive":"negative"}">${x.type==="income"?"+":"−"} ${fmt(x.amount,x.currency||A.profile.baseCurrency)}</b><div class="tiny muted">${x.date} · ${escape(x.source||x.note||"")}</div></div><span class="pill">${x.type==="income"?"Доход":"Расход"}</span></div>`).join(""):'<div class="empty">Событий в этом месяце нет.</div>'}</div>`)
}
function goalsPage(){
 shell(`<div class="grid"><div class="card col-12"><div class="row"><div><h2 style="margin:0">Цели</h2><div class="tiny muted">ARISE перераспределяет поток по приоритетам, срокам и прогрессу.</div></div><button class="btn primary" onclick="goalModal()">Добавить цель</button></div>${A.goals.map(goalCard).join("")}</div>
 <div class="card col-12"><h2>Приоритеты</h2>${A.goals.filter(g=>g.status!=="completed").map(g=>`<div class="row"><span>${escape(g.name)}</span><div style="display:flex;align-items:center;gap:10px"><input style="width:90px" type="number" min="1" max="5" value="${g.priority}" onchange="changePriority('${g.id}',this.value)"><span class="pill">1–5</span></div></div>`).join("")}</div></div>`)
}
function whatif(){
 const inc=currentIncome()||150000;
 shell(`<div class="grid"><div class="card col-4"><div class="kicker">СЦЕНАРИЙ</div><h1>Что если?</h1><div class="field" style="margin-top:18px"><label>Доход в месяц</label><input id="wi" type="number" value="${inc}" oninput="simulate()"></div><div class="notice" style="margin-top:14px">Сценарий не меняет реальные данные профиля.</div></div><div class="card col-8"><h2>Предлагаемое распределение</h2><div id="sim"></div></div><div class="card col-12"><h2>Что изменится по целям</h2><div id="simGoals"></div></div></div>`);simulate()
}
function simulate(){
 const p=plan(Number(document.getElementById("wi").value)||0), inc=Number(document.getElementById("wi").value)||0;
 document.getElementById("sim").innerHTML=`<div class="alloc-grid">${planRows(p).map(x=>`<div class="alloc"><div class="kicker">${escape(x.n)}</div><div class="amount">${money(x.v)}</div></div>`).join("")}</div>`;
 document.getElementById("simGoals").innerHTML=A.goals.map(g=>{const add=p.goals.find(x=>x.id===g.id)?.amount||0;const next=g.current+add;return `<div class="goal"><div class="goal-head"><span class="goal-name">${escape(g.name)}</span><span>${money(next)} / ${money(g.target)}</span></div><div class="progress"><div class="bar" style="width:${pct(next,g.target)}%"></div></div><div class="goal-meta">При сценарии ${money(inc)} · +${money(add)}</div></div>`}).join("")
}
function settings(){
 shell(`<div class="grid"><div class="card col-6"><h2>Профиль</h2><div class="form"><div class="field full"><label>Название профиля</label><input id="pname" value="${escape(A.profile.name)}"></div><div class="field"><label>Базовая валюта</label><select id="basecur">${currencies().map(c=>`<option ${c===A.profile.baseCurrency?"selected":""}>${c}</option>`).join("")}</select></div></div><div class="actions"><button class="btn primary" onclick="saveProfile()">Сохранить</button><button class="btn" onclick="toggleHidden()">Скрыть суммы</button></div></div>
 <div class="card col-6"><h2>Финансовые настройки</h2><div class="form">${numField("family","Семья",A.settings.family)}${numField("creativeMin","Минимум творчества",A.settings.creativeMin)}${numField("creativeTarget","Целевой бюджет творчества",A.settings.creativeTarget)}${numField("freeMin","Минимум свободных",A.settings.freeMin)}</div><div class="actions"><button class="btn primary" onclick="saveFinancialSettings()">Сохранить</button></div></div>
 <div class="card col-12"><h2>Профили</h2><div class="row"><span>${escape(A.profile.name)}</span><span class="pill">текущий</span></div><div class="actions"><button class="btn primary" onclick="profileModal()">Создать профиль</button><button class="btn" onclick="showAuth()">Выйти / сменить аккаунт</button></div></div>
 <div class="card col-12"><h2>Данные</h2><div class="actions"><button class="btn" onclick="backup()">Экспорт JSON</button><button class="btn" onclick="restore()">Импорт JSON</button></div><input id="file" type="file" accept="application/json" style="display:none" onchange="importFile(event)"></div></div>`)
}
function numField(id,l,v){return `<div class="field"><label>${l}</label><input id="${id}" type="number" min="0" value="${v}"></div>`}
function currencies(){return ["RUB","USD","EUR","TRY","GBP","AED","KZT","GEL"]}
function addIncome(){
 const amount=Number(document.getElementById("ia").value),date=document.getElementById("idate").value,source=document.getElementById("isrc").value.trim(),currency=document.getElementById("icur").value;
 if(!amount||!date)return toast("Укажи сумму и дату");
 const p=plan(amount);
 const id=safeId();
 A.transactions.push({id,type:"income",amount,date,source,currency,planStatus:"proposed"});
 saveLocal();showPlan(amount,id)
}
function showPlan(amount,incomeId=null){
 const p=plan(amount);
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-back" id="planModal"><div class="modal"><div class="row"><div><div class="kicker">ПЛАН ARISE</div><h2 style="margin:5px 0 0">Распределение ${money(amount)}</h2></div><button class="btn ghost" onclick="closeModal()">Закрыть</button></div>
 <div id="planRows">${planRows(p).map((x,i)=>`<div class="row"><span>${escape(x.n)}</span><input data-plan="${i}" type="number" min="0" value="${Math.round(x.v)}" style="width:150px;text-align:right"></div>`).join("")}</div>
 <div class="notice" style="margin-top:14px">Изменяй суммы как хочешь. После изменения ARISE пересчитает итог и покажет последствия для целей.</div>
 <div class="actions"><button class="btn primary" onclick="confirmPlan(${amount},'${incomeId||""}')">Подтвердить план</button><button class="btn" onclick="recalcPlan(${amount})">Пересчитать</button></div></div></div>`)
}
function recalcPlan(amount){closeModal();showPlan(amount)}
function closeModal(){document.querySelector(".modal-back")?.remove()}
function confirmPlan(amount,incomeId){
 const inputs=[...document.querySelectorAll("[data-plan]")], values=inputs.map(i=>Number(i.value)||0), labels=["base","family","creative","free"], allocation={};
 labels.forEach((k,i)=>allocation[k]=values[i]||0);
 const goalNames=activeGoals().map(g=>g.name);
 values.slice(4).forEach((v,i)=>{const g=activeGoals()[i];if(g&&v>0)allocation[g.id]=v});
 const income=A.transactions.find(x=>x.id===incomeId);if(income)income.planStatus="confirmed";
 A.allocations.push({id:safeId(),incomeId,amount,createdAt:new Date().toISOString(),allocation});
 // only goal allocations alter actual goal balances
 Object.entries(allocation).forEach(([k,v])=>{const g=A.goals.find(x=>x.id===k);if(g){g.current+=v;if(g.current>=g.target){g.current=g.target;g.status="completed";}}});
 saveLocal();closeModal();toast("План сохранён");go("home")
}
function addExpense(){
 const amount=Number(document.getElementById("ea").value),date=document.getElementById("edate").value,note=document.getElementById("enote").value.trim();
 if(!amount||!date)return toast("Укажи сумму и дату");A.transactions.push({id:safeId(),type:"expense",amount,date,note,currency:A.profile.baseCurrency});saveLocal();toast("Расход сохранён");go("expenses")
}
function removeTx(id){A.transactions=A.transactions.filter(x=>x.id!==id);saveLocal();go("expenses")}
function changePriority(id,v){const g=A.goals.find(x=>x.id===id);if(g){g.priority=Math.max(1,Math.min(5,Number(v)||1));saveLocal();toast("Приоритет обновлён")}}
function goalModal(){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-back"><div class="modal"><h2>Новая цель</h2><div class="form">
 <div class="field full"><label>Название</label><input id="gn" placeholder="Например, отпуск"></div><div class="field"><label>Сумма</label><input id="gt" type="number"></div><div class="field"><label>Текущая сумма</label><input id="gc" type="number" value="0"></div>
 <div class="field"><label>Приоритет 1–5</label><input id="gp" type="number" min="1" max="5" value="3"></div><div class="field"><label>Дедлайн</label><input id="gd" type="date"></div>
 </div><div class="actions"><button class="btn primary" onclick="createGoal()">Создать</button><button class="btn" onclick="closeModal()">Отмена</button></div></div></div>`)
}
function createGoal(){const name=gn.value.trim(),target=Number(gt.value),current=Number(gc.value)||0,priority=Number(gp.value)||3,deadline=gd.value;if(!name||!target)return toast("Заполни название и сумму");A.goals.push({id:safeId(),name,type:"goal",target,current,deadline,priority,status:current>=target?"completed":"active"});saveLocal();closeModal();go("goals")}
function profileModal(){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-back"><div class="modal"><h2>Новый профиль</h2><div class="choice-grid">
 <button class="choice" onclick="createProfile('blank')"><b>С нуля</b><div class="tiny muted">Пустая финансовая система</div></button>
 <button class="choice" onclick="createProfile('template')"><b>Шаблон ARISE</b><div class="tiny muted">Базовые блоки и цели</div></button>
 <button class="choice" onclick="createProfile('copy')"><b>Копия текущего</b><div class="tiny muted">Дублировать настройки и цели</div></button>
 </div></div></div>`)
}
function createProfile(mode){
 let base=clone(DEFAULT);base.profile.name=mode==="copy"?A.profile.name+" · копия":"Новый профиль";
 if(mode==="copy"){base.settings=clone(A.settings);base.goals=clone(A.goals);base.profile.baseCurrency=A.profile.baseCurrency}
 A=base;saveLocal();closeModal();go("home");toast("Профиль создан")
}
function profileMenu(){profileModal()}
function toggleHidden(){A.profile.hidden=!A.profile.hidden;saveLocal();go(page)}
function saveProfile(){A.profile.name=document.getElementById("pname").value.trim()||"Мой профиль";A.profile.baseCurrency=document.getElementById("basecur").value;saveLocal();toast("Профиль сохранён");go("settings")}
function saveFinancialSettings(){["family","creativeMin","creativeTarget","freeMin"].forEach(k=>A.settings[k]=Number(document.getElementById(k).value)||0);saveLocal();toast("Настройки сохранены");go("home")}
function backup(){const b=new Blob([JSON.stringify(A,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="arise-finance-backup.json";a.click();URL.revokeObjectURL(a.href)}
function restore(){document.getElementById("file").click()}
function importFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{A={...clone(DEFAULT),...JSON.parse(r.result)};saveLocal();toast("Данные восстановлены");go("home")}catch(_){toast("Не удалось прочитать файл")}};r.readAsText(f)}
function authScreen(){
 document.getElementById("root").innerHTML=`<div class="auth"><div class="auth-card"><div class="auth-logo">ARISE FINANCE</div><div class="auth-title">Финансы, которые<br>движутся вместе с тобой.</div><div class="auth-copy">Создай профиль, задай приоритеты — ARISE построит систему и будет пересчитывать её по мере изменений.</div>
 <div class="auth-grid"><button class="btn" onclick="authProvider('google')">Google</button><button class="btn" onclick="authProvider('apple')">Apple</button></div>
 <div class="separator">ИЛИ</div><div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"></div><div class="field" style="margin-top:10px"><label>Пароль</label><input id="authPass" type="password" placeholder="••••••••"></div><div class="actions"><button class="btn primary" onclick="emailAuth('signup')">Создать аккаунт</button><button class="btn" onclick="emailAuth('signin')">Войти</button></div>
 <div class="separator">ТЕЛЕФОН</div><div class="field"><label>Телефон</label><input id="authPhone" type="tel" placeholder="+7 ..."></div><div class="actions"><button class="btn" onclick="phoneAuth()">Получить код</button></div>
 <div class="notice" style="margin-top:18px">${hasSupabase?"Подключена облачная авторизация.":"Демо-режим: данные сохраняются на этом устройстве. Для production подключи Supabase по инструкции в README."}</div></div></div>`
}
async function emailAuth(mode){
 if(!hasSupabase)return showOnboarding();
 const email=document.getElementById("authEmail").value, password=document.getElementById("authPass").value;if(!email||!password)return toast("Укажи email и пароль");
 const r=mode==="signup"?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)return toast(r.error.message);showOnboarding()
}
async function authProvider(provider){
 if(!hasSupabase)return showOnboarding();
 const r=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin}});if(r.error)toast(r.error.message)
}
async function phoneAuth(){
 if(!hasSupabase)return showOnboarding();
 const phone=document.getElementById("authPhone").value;if(!phone)return toast("Укажи телефон");const r=await sb.auth.signInWithOtp({phone});if(r.error)toast(r.error.message);else toast("Код отправлен")
}
function showAuth(){authScreen()}
function showOnboarding(){
 onboardingStep=0;onboarding={name:"",currency:"RUB",income:150000,family:20000,creativeMin:5000,creativeTarget:12500,freeMin:20000};renderOnboarding()
}
function renderOnboarding(){
 const steps=5;
 const content=[
  `<h1>Соберём твою систему</h1><p class="auth-copy">Несколько шагов — и ARISE построит первый план.</p><div class="field"><label>Название профиля</label><input id="obName" value="${escape(onboarding.name)}" placeholder="Личный профиль"></div>`,
  `<h1>Базовая валюта</h1><p class="auth-copy">Позже можно будет переключать отображение и добавлять другие валюты.</p><div class="choice-grid">${currencies().slice(0,6).map(c=>`<button class="choice ${onboarding.currency===c?"selected":""}" onclick="onboarding.currency='${c}';renderOnboarding()">${c}</button>`).join("")}</div>`,
  `<h1>Текущий доход</h1><p class="auth-copy">Можно изменить позже и добавить сколько угодно источников.</p><div class="field"><label>Средний доход в месяц</label><input id="obIncome" type="number" value="${onboarding.income}"></div>`,
  `<h1>Базовые блоки</h1><div class="form">${numField("obFamily","Семья",onboarding.family)}${numField("obCreativeMin","Минимум творчества",onboarding.creativeMin)}${numField("obCreativeTarget","Целевой бюджет творчества",onboarding.creativeTarget)}${numField("obFree","Минимум свободных",onboarding.freeMin)}</div>`,
  `<h1>Начальные цели</h1><p class="auth-copy">ARISE начнёт с них, а потом ты сможешь создавать любые свои цели.</p><div class="notice">Резерв · Турция · BMW G20</div><div class="field" style="margin-top:12px"><label>Приоритеты можно изменить позже онлайн</label><input id="obReserve" type="number" value="5" placeholder="Резерв"></div>`
 ][onboardingStep];
 document.getElementById("root").innerHTML=`<div class="onboarding"><div class="on-card"><div class="steps">${Array.from({length:steps},(_,i)=>`<div class="step ${i<=onboardingStep?"on":""}"></div>`).join("")}</div>${content}<div class="actions"><button class="btn ${onboardingStep===steps-1?"primary":""}" onclick="obNext()">${onboardingStep===steps-1?"Создать систему":"Продолжить"}</button>${onboardingStep>0?`<button class="btn ghost" onclick="onboardingStep--;renderOnboarding()">Назад</button>`:""}</div></div></div>`
}
function obNext(){
 if(onboardingStep===0)onboarding.name=document.getElementById("obName").value.trim()||"Личный профиль";
 if(onboardingStep===2)onboarding.income=Number(document.getElementById("obIncome").value)||150000;
 if(onboardingStep===3){onboarding.family=Number(obFamily.value)||0;onboarding.creativeMin=Number(obCreativeMin.value)||0;onboarding.creativeTarget=Number(obCreativeTarget.value)||0;onboarding.freeMin=Number(obFree.value)||0}
 if(onboardingStep<4){onboardingStep++;renderOnboarding();return}
 A=clone(DEFAULT);A.profile.name=onboarding.name;A.profile.baseCurrency=onboarding.currency;A.settings.family=onboarding.family;A.settings.creativeMin=onboarding.creativeMin;A.settings.creativeTarget=onboarding.creativeTarget;A.settings.freeMin=onboarding.freeMin;saveLocal();if(onboarding.income)A.transactions.push({id:safeId(),type:"income",amount:onboarding.income,date:today(),source:"Стартовый доход",currency:onboarding.currency,planStatus:"proposed"});saveLocal();go("home")
}
function go(t){page=t;({home,income:incomePage,expenses,calendar,goals:goalsPage,whatif,settings}[t]||home)()}
function renderFatalError(err){
 const root=document.getElementById("root");
 if(root)root.innerHTML=`<div class="auth"><div class="auth-card"><div class="auth-logo">ARISE FINANCE</div><div class="auth-title">Не удалось запустить приложение</div><div class="auth-copy">ARISE остановился при запуске. Данные не удалены.</div><div class="notice" style="white-space:pre-wrap;word-break:break-word">${escape(String(err&&err.message||err||"Неизвестная ошибка"))}</div><div class="actions"><button class="btn primary" onclick="location.reload()">Повторить</button><button class="btn" onclick="try{localStorage.removeItem(LOCAL_KEY);localStorage.removeItem('arise_seen_v3')}catch(e){};location.reload()">Сбросить локальные данные</button></div></div></div>`;
}
function bootstrap(){
 try{
  A=normalizeState(A);
  const seen=localStorage.getItem("arise_seen_v3");
  if(!seen){try{localStorage.setItem("arise_seen_v3","1")}catch(e){};showOnboarding()}else{go("home")}
 }catch(err){renderFatalError(err)}
}
window.addEventListener("error",e=>renderFatalError(e.error||e.message));
window.addEventListener("unhandledrejection",e=>renderFatalError(e.reason||"Unhandled promise rejection"));
document.getElementById("root").innerHTML =
  '<div style="padding:40px;color:white;font-family:sans-serif">JS WORKS</div>';
</script>
</body></html>
