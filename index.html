<style>
:root{
 --bg:#090c11;--panel:#10151d;--panel2:#141b24;--line:#222b36;--text:#eef2f6;--muted:#8d98a7;

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:
 radial-gradient(900px 500px at 90% -10%,rgba(139,157,190,.10),transparent 65%),
 radial-gradient(700px 500px at -10% 40%,rgba(187,166,135,.07),transparent 65%),var(--bg);
 color:var(--text);font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8290ad;outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}.col-4{grid-column:span 4}
.card{background:linear-gradient(180deg,rgba(20,27,36,.96),rgba(15,20,27,.96));border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);animation:rise .38s ease both}

.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);background:#0c1118;color:var(--text);border-radius:13px;padding:12px 13px}.field small{color:var(--muted);font-size:10px}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:10px;color:var(--muted);white-space:nowrap}
.progress{height:8px;background:#202833;border-radius:99px;overflow:hidden;margin:10px 0 7px}.bar{height:100%;width:0;background:linear-gradient(90deg,#7787a4,#b3a98f);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.goal{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.055)}.goal:last-child{border-bottom:0}
.goal-head{display:flex;justify-content:space-between;gap:10px}.goal-name{font-weight:700}.goal-meta{font-size:11px;color:var(--muted);margin-top:3px}
.chart{height:210px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.chart-line{fill:none;stroke:#b7c2d3;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:800;stroke-dashoffset:800;animation:draw 1.2s ease forwards}.chart-fill{fill:url(#g)}@keyframes draw{to{stroke-dashoffset:0}}
.bar-chart{display:flex;align-items:end;gap:8px;height:160px;padding-top:15px}.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:end}.bar-col{width:100%;max-width:34px;background:linear-gradient(180deg,#9aa8c5,#59677c);border-radius:8px 8px 3px 3px;min-height:3px;animation:barIn .8s ease both;transform-origin:bottom}.bar-label{font-size:9px;color:var(--muted)}@keyframes barIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.alloc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.alloc{padding:13px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.015)}.alloc .amount{font-size:17px;font-weight:800;margin-top:5px}
.notice{padding:13px 14px;border-radius:15px;background:rgba(154,168,197,.07);border:1px solid rgba(154,168,197,.16);color:#cbd4e2;font-size:12px;line-height:1.55}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}.event{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.055)}.event:last-child{border-bottom:0}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none}.bottom-inner{pointer-events:auto;display:flex;gap:8px;padding:7px;border:1px solid var(--line);background:rgba(12,16,22,.9);backdrop-filter:blur(20px);border-radius:18px;box-shadow:var(--shadow)}.bottom button{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:12px}.bottom button.active{background:#1a222d;color:var(--text)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(7px);z-index:60;display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#10151d;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.55);animation:rise .25s ease}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(460px,100%);padding:28px;border:1px solid var(--line);border-radius:28px;background:rgba(15,20,27,.92);box-shadow:var(--shadow);backdrop-filter:blur(20px)}.auth-logo{font-size:14px;letter-spacing:.22em;font-weight:800;margin-bottom:40px}.auth-title{font-size:31px;letter-spacing:-.05em;font-weight:800}.auth-copy{color:var(--muted);font-size:13px;line-height:1.6;margin:8px 0 24px}.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.auth-grid .btn{padding:12px 8px}.separator{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10px;margin:17px 0}.separator:before,.separator:after{content:"";height:1px;background:var(--line);flex:1}
.onboarding{min-height:100vh;display:grid;place-items:center;padding:20px}.on-card{width:min(680px,100%);border:1px solid var(--line);border-radius:28px;background:rgba(15,20,27,.96);padding:25px;box-shadow:var(--shadow)}.steps{display:flex;gap:6px;margin-bottom:24px}.step{height:3px;flex:1;background:#242c37;border-radius:9px}.step.on{background:#aeb9ca}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{padding:14px;border:1px solid var(--line);border-radius:15px;background:#0c1118;color:var(--text);text-align:left}.choice.selected{border-color:#aeb9ca;background:#1b232e}
.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%) translateY(15px);z-index:100;background:#e1e5eb;color:#111720;padding:11px 14px;border-radius:13px;font-size:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){.shell{padding:14px 12px 105px}.grid{grid-template-columns:1fr 1fr}.col-12,.col-8,.col-6,.col-4{grid-column:span 2}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.value{font-size:27px}.nav{top:4px}.hide-mobile{display:none}.alloc-grid{grid-template-columns:1fr 1fr}}
</style>

<script>
window.onerror = function(message, source, line, column) {
  document.body.innerHTML =
    '<pre style="white-space:pre-wrap;background:#000;color:#fff;padding:20px;font:16px monospace">' +
    'JS ERROR\n\n' +
    message +
    '\n\nLINE: ' + line +
    '\nCOLUMN: ' + column +
    '</pre>';
};
</script>

<script>
try {
  const hasSupabase = false;
  const sb = null;
  const LOCAL_KEY = "arise_finance_local_v3";

  const DEFAULT = {
    profile:{id:"local",name:"Мой профиль",baseCurrency:"RUB",hidden:false},
    settings:{
      settings:{
  basicNeeds:35700,
  family:20000,
  creativeMin:5000,
  creativeTarget:12500,
  freeMin:20000,
  reserveTarget:300000
},
    goals:[
      {id:"reserve",name:"Финансовый резерв",type:"reserve",target:300000,current:0,deadline:"",priority:5,status:"active"},
      {id:"turkey",name:"Турция",type:"goal",target:125000,current:0,deadline:"",priority:4,status:"active"},
      {id:"bmw",name:"BMW G20",type:"goal",target:2000000,current:0,deadline:"",priority:2,status:"active"}
    ],
    transactions:[],
    allocations:[],
    monthlyPlans:[],
    currencyRates:{}
  };

  function clone(x){
    return JSON.parse(JSON.stringify(x));
  }

  function safeId(){
    return "id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10);
  }

  function normalizeState(raw){
    const base=clone(DEFAULT);
    const src=raw&&typeof raw==="object"?raw:{};

    const out={
      ...base,
      ...src,
      profile:{
        ...base.profile,
        ...(src.profile&&typeof src.profile==="object"?src.profile:{})
      },
      settings:{
        ...base.settings,
        ...(src.settings&&typeof src.settings==="object"?src.settings:{})
      }
    };

    out.goals=Array.isArray(src.goals)
      ? src.goals.filter(Boolean).map(g=>({
          id:g.id||safeId(),
          name:g.name||"Цель",
          type:g.type||"goal",
          target:Number(g.target)||0,
          current:Number(g.current)||0,
          deadline:g.deadline||"",
          priority:Number(g.priority)||3,
          status:g.status||"active",
          ...g
        }))
      : clone(base.goals);

    out.transactions=Array.isArray(src.transactions)
      ? src.transactions.filter(Boolean)
      : [];

    out.allocations=Array.isArray(src.allocations)
      ? src.allocations.filter(Boolean)
      : [];

    out.monthlyPlans=Array.isArray(src.monthlyPlans)
      ? src.monthlyPlans.filter(Boolean)
      : [];

    out.currencyRates=
      src.currencyRates&&
      typeof src.currencyRates==="object"&&
      !Array.isArray(src.currencyRates)
        ? src.currencyRates
        : {};

    if(!out.profile.baseCurrency){
      out.profile.baseCurrency="RUB";
    }

    return out;
  }

  function loadLocal(){
    try{
      const raw=localStorage.getItem(LOCAL_KEY);
      return normalizeState(raw?JSON.parse(raw):null);
    }catch(e){
      try{
        localStorage.removeItem(LOCAL_KEY);
      }catch(_){}
      return clone(DEFAULT);
    }
  }

  function saveLocal(){
    try{
      localStorage.setItem(
        LOCAL_KEY,
        JSON.stringify(normalizeState(A))
      );
      return true;
    }catch(e){
      return false;
    }
  }

  let A=loadLocal();
  // =========================
  // JS TEST 4 — FINANCIAL ENGINE
  // =========================

  function num(v){
    const n=Number(v);
    return Number.isFinite(n)?n:0;
  }

  function sum(arr,fn){
    return arr.reduce((s,x)=>s+num(fn(x)),0);
  }

  function getActiveGoals(state){
    return (state.goals||[])
      .filter(g=>
        g &&
        g.status!=="completed" &&
        g.type!=="reserve"
      )
      .sort((a,b)=>num(b.priority)-num(a.priority));
}

  function calculateFinancialPlan(income,state=A){
    const total=num(income);

    if(total<=0){
      return {
        income:0,
        family:0,
        creative:0,
        free:0,
        reserve:0,
        goals:[],
        distributed:0,
        remaining:0
      };
    }

    const settings=state.settings||{};

    const basicNeeds=Math.max(0,num(settings.basicNeeds));
const familyMin=Math.max(0,num(settings.family));
const creativeMin=Math.max(0,num(settings.creativeMin));
    const creativeTarget=Math.max(creativeMin,num(settings.creativeTarget));
    const freeMin=Math.max(0,num(settings.freeMin));
    const reserveTarget=Math.max(0,num(settings.reserveTarget));

    let remaining=total;

    const basic=Math.min(remaining,basicNeeds);
remaining-=basic;

const family=Math.min(remaining,familyMin);
remaining-=family;

const creative=Math.min(remaining,creativeTarget);

    const free=Math.min(remaining,freeMin);
    remaining-=free;

    const currentReserve=sum(
      state.goals||[],
      g=>g.type==="reserve"?g.current:0
    );

    const reserveNeed=Math.max(0,reserveTarget-currentReserve);
const reserveMonthlyLimit=30000;
const reserve=Math.min(
  remaining,
  reserveNeed,
  reserveMonthlyLimit
);
remaining-=reserve;

    const goals=[];
    const activeGoals=getActiveGoals(state);

    activeGoals.forEach(goal=>{
      if(remaining<=0)return;

      const target=num(goal.target);
      const current=num(goal.current);
      const need=Math.max(0,target-current);

      if(need<=0)return;

      const amount=Math.min(remaining,need);

      goals.push({
        id:goal.id,
        name:goal.name,
        amount,
        needBefore:need,
        needAfter:need-amount
      });

      remaining-=amount;
    });

    return {
  income:total,
  basic,
  family,
      creative,
      free,
      reserve,
      goals,
      distributed:total-remaining,
      remaining
    };
  }

  function applyFinancialPlan(plan,state=A,meta={}){
  if(!plan||!state)return false;

  const now=new Date();
  const month=now.toISOString().slice(0,7);

  state.monthlyPlans=Array.isArray(state.monthlyPlans)
    ? state.monthlyPlans
    : [];

  state.allocations=Array.isArray(state.allocations)
    ? state.allocations
    : [];

  state.transactions=Array.isArray(state.transactions)
    ? state.transactions
    : [];

  const source=(meta.source||"Без источника").trim();
  const date=meta.date||now.toISOString().slice(0,10);

  // Записываем сам доход
  state.transactions.push({
    id:safeId(),
    type:"income",
    amount:plan.income,
    source,
    date,
    month,
    createdAt:now.toISOString()
  });

  // Сохраняем рассчитанный план
  const planRecord={
    id:safeId(),
    month,
    income:plan.income,
    source,
    date,
    family:plan.family,
    creative:plan.creative,
    free:plan.free,
    reserve:plan.reserve,
    goals:clone(plan.goals),
    distributed:plan.distributed,
    remaining:plan.remaining,
    createdAt:now.toISOString()
  };

  state.monthlyPlans.push(planRecord);

  // Резерв
  if(plan.reserve>0){
    const reserveGoal=state.goals.find(
      g=>g.type==="reserve"
    );

    if(reserveGoal){
      reserveGoal.current=
        num(reserveGoal.current)+plan.reserve;
    }
  }

  // Цели
  plan.goals.forEach(item=>{
    const goal=state.goals.find(
      g=>g.id===item.id
    );

    if(goal){
      goal.current=
        num(goal.current)+num(item.amount);

      if(num(goal.current)>=num(goal.target)){
        goal.current=num(goal.target);
        goal.status="completed";
      }
    }
  });

  saveLocal();
  return true;
}

  function runFinancialEngineTest(){
    const testState=normalizeState({
      profile:{name:"TEST"},
      settings:{
  basicNeeds:35700,
  family:20000,
  creativeMin:5000,
  creativeTarget:12500,
  freeMin:20000,
  reserveTarget:300000
},
      goals:[
        {
          id:"reserve",
          name:"Финансовый резерв",
          type:"reserve",
          target:300000,
          current:0,
          priority:5,
          status:"active"
        },
        {
          id:"turkey",
          name:"Турция",
          type:"goal",
          target:125000,
          current:0,
          priority:4,
          status:"active"
        },
        {
          id:"bmw",
          name:"BMW G20",
          type:"goal",
          target:2000000,
          current:0,
          priority:2,
          status:"active"
        }
      ]
    });

    const plan=calculateFinancialPlan(150000,testState);

    const checks=[
      ["Доход",plan.income===150000],
      ["Базовые потребности",plan.basic===35700],
      ["Семья",plan.family===20000],
      ["Творчество",plan.creative===12500],
      ["Свободные деньги",plan.free===20000],
      ["Резерв",plan.reserve===30000],
      ["Распределено",plan.distributed===150000],
 ["Остаток",plan.remaining===0],
      ["Есть цели",Array.isArray(plan.goals)],
      ["Турция получила деньги",
  plan.goals.some(
    g=>g.id==="turkey"&&g.amount===31800
  )
];

    const failed=checks.filter(x=>!x[1]);

    return {
      ok:failed.length===0,
      plan,
      checks,
      failed
    };
  }

  const ENGINE_TEST=runFinancialEngineTest();

    // =========================
  // ARISE FINANCE — LIVE PLAN
  // =========================

  function formatMoney(value){
    return num(value).toLocaleString("ru-RU") + " ₽";
  }

  function renderPlan(plan){
    const goalHtml = plan.goals.length
      ? plan.goals.map(goal=>`
          <div style="
            display:flex;
            justify-content:space-between;
            gap:16px;
            padding:14px 0;
            border-bottom:1px solid rgba(255,255,255,.055);
          ">
            <div>
              <div style="font-weight:700">${goal.name}</div>
              <div style="margin-top:4px;color:#8d98a7;font-size:11px">
                Приоритетная цель
              </div>
            </div>

            <div style="
              font-size:16px;
              font-weight:800;
              white-space:nowrap;
            ">
              ${formatMoney(goal.amount)}
            </div>
          </div>
        `).join("")
      : `
        <div style="padding:20px 0;color:#8d98a7">
          На цели пока ничего не распределено.
        </div>
      `;

    return `
      <div style="
        margin-top:20px;
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:10px;
      ">

        <div style="
          padding:16px;
          border:1px solid #222b36;
          border-radius:16px;
          background:#0c1118;
        ">
          <div style="color:#8d98a7;font-size:11px">Семья</div>
          <div style="font-size:20px;font-weight:800;margin-top:6px">
            ${formatMoney(plan.family)}
          </div>
        </div>

        <div style="
          padding:16px;
          border:1px solid #222b36;
          border-radius:16px;
          background:#0c1118;
        ">
          <div style="color:#8d98a7;font-size:11px">Творчество</div>
          <div style="font-size:20px;font-weight:800;margin-top:6px">
            ${formatMoney(plan.creative)}
          </div>
        </div>

        <div style="
          padding:16px;
          border:1px solid #222b36;
          border-radius:16px;
          background:#0c1118;
        ">
          <div style="color:#8d98a7;font-size:11px">Свободные</div>
          <div style="font-size:20px;font-weight:800;margin-top:6px">
            ${formatMoney(plan.free)}
          </div>
        </div>

        <div style="
          padding:16px;
          border:1px solid #222b36;
          border-radius:16px;
          background:#0c1118;
        ">
          <div style="color:#8d98a7;font-size:11px">Резерв</div>
          <div style="font-size:20px;font-weight:800;margin-top:6px">
            ${formatMoney(plan.reserve)}
          </div>
        </div>
      </div>

      <div style="
        margin-top:14px;
        padding:18px;
        border:1px solid #222b36;
        border-radius:18px;
        background:#0c1118;
      ">
        <div style="
          font-size:12px;
          color:#8d98a7;
          margin-bottom:4px;
        ">
          Цели
        </div>

        ${goalHtml}
      </div>

      <div style="
        margin-top:14px;
        display:flex;
        justify-content:space-between;
        gap:12px;
        padding:16px 18px;
        border-radius:16px;

    function formatMoney(value){
    return num(value).toLocaleString("ru-RU") + " ₽";
  }

  function renderApp(){
    document.getElementById("root").innerHTML=`
      <div class="app">
        <div class="shell">

          <div class="top">
            <div class="brand">
              ARISE <span>FINANCE</span>
            </div>

            <div class="profile">
              <div class="avatar">
                ${(A.profile.name||"М").slice(0,1).toUpperCase()}
              </div>
              <span>${A.profile.name||"Мой профиль"}</span>
            </div>
          </div>

          <div class="nav">
            <button class="active" data-page="home">Главная</button>
            <button data-page="income">Доход</button>
            <button data-page="goals">Цели</button>
            <button data-page="history">История</button>
            <button data-page="profile">Профиль</button>
          </div>

          <div id="page"></div>

        </div>
      </div>
    `;

    const page=document.getElementById("page");

    function money(v){
      return formatMoney(v);
    }

    function renderHome(){
      const income=A.monthlyPlans?.length
        ? A.monthlyPlans[A.monthlyPlans.length-1].income
        : 0;

      const reserve=(A.goals||[])
        .filter(g=>g.type==="reserve")
        .reduce((s,g)=>s+num(g.current),0);

      const goals=(A.goals||[])
        .filter(g=>g.type!=="reserve" && g.status!=="completed");

      page.innerHTML=`
        <div class="grid">

          <div class="col-12">
            <div class="card">
              <div class="kicker">ФИНАНСОВАЯ СИСТЕМА</div>
              <h1>Твои деньги под контролем.</h1>
              <div class="sub">
                ARISE распределяет доход согласно твоим приоритетам.
              </div>

              <div class="actions">
                <button class="btn primary" id="newIncome">
                  Добавить доход
                </button>

                <button class="btn ghost" id="newGoal">
                  Добавить цель
                </button>
              </div>
            </div>
          </div>

          <div class="col-4">
            <div class="card">
              <div class="kicker">ПОСЛЕДНИЙ ДОХОД</div>
              <div class="value">${money(income)}</div>
              <div class="sub">Последний рассчитанный доход</div>
            </div>
          </div>

          <div class="col-4">
            <div class="card">
              <div class="kicker">РЕЗЕРВ</div>
              <div class="value">${money(reserve)}</div>
              <div class="sub">
                Цель ${money(A.settings.reserveTarget)}
              </div>
            </div>
          </div>

          <div class="col-4">
            <div class="card">
              <div class="kicker">ЦЕЛИ</div>
              <div class="value">${goals.length}</div>
              <div class="sub">Активных целей</div>
            </div>
          </div>

          <div class="col-12">
            <div class="card">
              <h2>Активные цели</h2>

              ${
                goals.length
                ? goals.map(g=>{
                    const target=num(g.target);
                    const current=num(g.current);
                    const percent=target>0
                      ? Math.min(100,current/target*100)
                      : 0;

                    return `
                      <div class="goal">
                        <div class="goal-head">
                          <div>
                            <div class="goal-name">${g.name}</div>
                            <div class="goal-meta">
                              ${money(current)} из ${money(target)}
                            </div>
                          </div>

                          <div class="pill">
                            ${Math.round(percent)}%
                          </div>
                        </div>

                        <div class="progress">
                          <div
                            class="bar"
                            style="width:${percent}%"
                          ></div>
                        </div>
                      </div>
                    `;
                  }).join("")
                : `
                  <div class="empty">

                  </div>

      document.getElementById("newIncome")

      document.getElementById("newGoal")
        .addEventListener("click",()=>showGoal());
    }

    function showIncome(){
  page.innerHTML=`
    <div class="grid">

      <div class="col-12">
        <div class="card">

          <div class="kicker">НОВЫЙ ДОХОД</div>
          <h1>Распредели доход</h1>

          <div class="sub">
            Введи сумму и укажи источник дохода.
          </div>

          <div class="form" style="margin-top:20px">

            <div class="field full">
              <label>Сумма дохода</label>
              <input
                id="incomeInput"
                type="number"
                inputmode="decimal"
                placeholder="150000"
              >
            </div>

            <div class="field">
              <label>Источник дохода</label>
              <input
                id="incomeSource"
                type="text"
                placeholder="Например, Работа 1"
              >
            </div>

            <div class="field">
              <label>Дата</label>
              <input
                id="incomeDate"
                type="date"
                value="${new Date().toISOString().slice(0,10)}"
              >
            </div>

          </div>

          <div class="actions">

            <button
              class="btn primary"
              id="calculateBtn"
            >
              Рассчитать
            </button>

            <button
              class="btn ghost"
              id="backHome"
            >
              Назад
            </button>

          </div>

          <div id="planResult"></div>

        </div>
      </div>

    </div>
  `;

  const input=document.getElementById("incomeInput");
  const sourceInput=document.getElementById("incomeSource");
  const dateInput=document.getElementById("incomeDate");
  const result=document.getElementById("planResult");

  document.getElementById("backHome")
    .addEventListener("click",renderHome);

  document.getElementById("calculateBtn")
    .addEventListener("click",calculate);

  input.addEventListener("keydown",e=>{
    if(e.key==="Enter")calculate();
  });

  function calculate(){
    const income=num(input.value);
    const source=sourceInput.value.trim();
    const date=dateInput.value;

    if(income<=0){
      result.innerHTML=`
        <div class="notice" style="margin-top:16px">
          Введи доход больше 0 ₽.
        </div>
      `;
      return;
    }

    if(!source){
      result.innerHTML=`
        <div class="notice" style="margin-top:16px">
          Укажи источник дохода.
        </div>
      `;
      return;
    }

    const plan=calculateFinancialPlan(income,A);

    result.innerHTML=`
      <div style="margin-top:20px">

        <div class="notice">
          План рассчитан для дохода
          <strong>${money(income)}</strong>
          <br>
          Источник: <strong>${source}</strong>
        </div>

        <div class="alloc-grid" style="margin-top:12px">

          <div class="alloc">
            <div class="kicker">СЕМЬЯ</div>
            <div class="amount">${money(plan.family)}</div>
          </div>

          <div class="alloc">
            <div class="kicker">ТВОРЧЕСТВО</div>
            <div class="amount">${money(plan.creative)}</div>
          </div>

          <div class="alloc">
            <div class="kicker">СВОБОДНЫЕ</div>
            <div class="amount">${money(plan.free)}</div>
          </div>

          <div class="alloc">
            <div class="kicker">РЕЗЕРВ</div>
            <div class="amount">${money(plan.reserve)}</div>
          </div>

        </div>

        <div class="card" style="margin-top:14px;padding:16px">

          <h2>Цели</h2>

          ${
            plan.goals.length
            ? plan.goals.map(g=>`
                <div class="row">
                  <div>
                    <strong>${g.name}</strong>
                    <div class="tiny muted">
                      Требовалось ${money(g.needBefore)}
                    </div>
                  </div>

                  <strong>
                    ${money(g.amount)}
                  </strong>
                </div>
              `).join("")
            : `
              <div class="empty">
                Деньги на цели не распределены.
              </div>
            `
          }

        </div>

        <div class="row" style="margin-top:8px">
          <span class="muted">Распределено</span>
          <strong>${money(plan.distributed)}</strong>
        </div>

        <div class="row">
          <span class="muted">Остаток</span>
          <strong>${money(plan.remaining)}</strong>
        </div>

        <div class="actions">

          <button
            class="btn primary"
            id="applyPlan"
          >
            Применить план
          </button>

          <button
            class="btn ghost"
            id="recalculate"
          >
            Пересчитать
          </button>

        </div>

      </div>
    `;

    document.getElementById("recalculate")
      .addEventListener("click",calculate);

    document.getElementById("applyPlan")
      .addEventListener("click",()=>{
        applyFinancialPlan(plan,A,{
          source,
          date
        });

        result.innerHTML=`
          <div class="notice" style="margin-top:16px">
            ✓ Доход сохранён и распределён.
          </div>
        `;

        setTimeout(renderHome,700);
      });
  }
}

    function showGoal(){
      page.innerHTML=`
        <div class="grid">

          <div class="col-12">
            <div class="card">

              <div class="kicker">НОВАЯ ЦЕЛЬ</div>
              <h1>Создать цель</h1>

              <div class="form" style="margin-top:20px">

                <div class="field full">
                  <label>Название</label>
                  <input
                    id="goalName"
                    placeholder="Например, отпуск"
                  >
                </div>

                <div class="field">
                  <label>Сумма цели</label>
                  <input
                    id="goalTarget"
                    type="number"
                    inputmode="decimal"
                    placeholder="125000"
                  >
                </div>

                <div class="field">
                  <label>Приоритет</label>
                  <select id="goalPriority">
                    <option value="5">5 — очень высокий</option>
                    <option value="4" selected>4 — высокий</option>
                    <option value="3">3 — обычный</option>
                    <option value="2">2 — низкий</option>
                    <option value="1">1 — минимальный</option>
                  </select>
                </div>

              </div>

              <div class="actions">

                <button
                  class="btn primary"
                  id="saveGoal"
                >
                  Создать цель
                </button>

                <button
                  class="btn ghost"
                  id="cancelGoal"
                >
                  Назад
                </button>

              </div>

            </div>
          </div>

        </div>
      `;

      document.getElementById("cancelGoal")
        .addEventListener("click",renderHome);

      document.getElementById("saveGoal")
        .addEventListener("click",()=>{
          const name=document.getElementById("goalName").value.trim();
          const target=num(document.getElementById("goalTarget").value);
          const priority=num(document.getElementById("goalPriority").value);

          if(!name || target<=0){
            alert("Заполни название и сумму цели.");
            return;
          }

          A.goals.push({
            id:safeId(),
            name,
            type:"goal",
            target,
            current:0,
            deadline:"",
            priority,
            status:"active"
          });

          saveLocal();

          renderGoals();
        });
    }

    function renderGoals(){
      page.innerHTML=`
        <div class="grid">

          <div class="col-12">
            <div class="card">

              <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:10px;
              ">
                <div>
                  <div class="kicker">ЦЕЛИ</div>
                  <h1>Мои цели</h1>
                </div>

                <button class="btn primary" id="addGoal">
                  + Цель
                </button>
              </div>

              <div style="margin-top:18px">

                ${
                  A.goals.length
                  ? A.goals.map(g=>{

                      const target=num(g.target);
                      const current=num(g.current);
                      const percent=target
                        ? Math.min(100,current/target*100)
                        : 0;

                      return `
                        <div class="goal">

                          <div class="goal-head">

                            <div>
                              <div class="goal-name">
                                ${g.name}
                              </div>

                              <div class="goal-meta">
                                ${money(current)}
                                из
                                ${money(target)}
                              </div>
                            </div>

                            <div class="pill">
                              Приоритет ${g.priority}
                            </div>

                          </div>

                          <div class="progress">
                            <div
                              class="bar"
                              style="width:${percent}%"
                            ></div>
                          </div>

                        </div>
                      `;

                    }).join("")
                  : `
                    <div class="empty">
                      Целей пока нет.
                    </div>
                  `
                }

              </div>

            </div>
          </div>

        </div>
      `;

      document.getElementById("addGoal")
        .addEventListener("click",showGoal);
    }

    function renderProfile(){
      page.innerHTML=`
        <div class="grid">

          <div class="col-12">
            <div class="card">

              <div class="kicker">ПРОФИЛЬ</div>
              <h1>${A.profile.name}</h1>

              <div class="row">

                <strong>${A.profile.baseCurrency}</strong>
              </div>

              <div class="row">

                <strong>${money(A.settings.family)}</strong>
              </div>

              <div class="row">
                <span class="muted">Творчество</span>
                <strong>${money(A.settings.creativeTarget)}</strong>
              </div>

              <div class="row">
                <span class="muted">Свободные деньги</span>
                <strong>${money(A.settings.freeMin)}</strong>
              </div>

                <strong>${money(A.settings.reserveTarget)}</strong>

    function setPage(name){
      document.querySelectorAll(".nav button")
        .forEach(btn=>{
          btn.classList.toggle(
            "active",
            btn.dataset.page===name
          );
        });

      if(name==="home")renderHome();
      if(name==="income")showIncome();
      if(name==="goals")renderGoals();
      if(name==="history")renderHistory();
      if(name==="profile")renderProfile();
    }

    document.querySelectorAll(".nav button")
      .forEach(button=>{
        button.addEventListener("click",()=>{
          setPage(button.dataset.page);
        });
      });

    renderHome();
  }

  renderApp();
  

}catch(error){

  document.getElementById("root").innerHTML=`
    <pre style="
      white-space:pre-wrap;
      padding:30px;
      color:#fff;
      background:#000;
      font:16px monospace;
    ">JS ERROR

${String(error&&error.stack||error)}</pre>
  `;

}
</script>
